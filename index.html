                    }}
                    style={{ backgroundColor: accentColor }}
                    className="w-full text-black font-extrabold py-3.5 rounded-2xl text-xs shadow-lg hover:brightness-110 transition"
                  >
                    👑 Uppgradera till Royal nu (Reklamfritt)
                  </button>
                  <button
                    onClick={() => setAnnoyingAdPopup(false)}
                    className="text-xs text-zinc-500 hover:text-zinc-300 pt-1 block w-full"
                  >
                    Fortsätt med reklam i gratisversionen
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BETALVÄGG-MODAL FÖR ROYAL / PREMIUM-VERSIONEN */}
          {paywallModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
              <div className="bg-[#111215] border-2 border-[#F3D078] rounded-3xl w-full max-w-md p-7 space-y-5 shadow-[0_0_50px_rgba(243,208,120,0.3)] text-center">
                <div className="w-16 h-16 rounded-full bg-[#F3D078] text-black font-black text-3xl flex items-center justify-center mx-auto shadow-lg">
                  👑
                </div>
                <div className="space-y-1.5">
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#F3D078]">ZAPPAPORTALEN ROYAL</span>
                  <h3 className="text-xl font-black text-white">Uppgradera till Royal – Helt Reklamfritt</h3>
                  <p className="text-xs text-zinc-400 leading-relaxed">
                    Med Zappaportalen Royal försvinner alla reklambanners och alla 5-sekunders zapp-avbrott direkt.
                  </p>
                </div>

                <div className="p-4 rounded-2xl bg-black/60 border border-white/10 text-left space-y-2 text-xs text-zinc-200">
                  <p>✓ <strong>Omedelbar Kanalzappning (CH+ / CH-)</strong> utan reklam</p>
                  <p>✓ 100 % Reklamfritt i hela portalen</p>
                  <p>✓ Synka M3U, EPG & Smarta Mappar mellan alla enheter</p>
                </div>

                <div className="space-y-2.5 pt-2">
                  <a
                    href={STRIPE_OR_PAYMENT_LINK}
                    target="_blank"
                    rel="noreferrer"
                    style={{ backgroundColor: accentColor }}
                    className="block w-full text-black font-extrabold py-3.5 rounded-2xl text-xs shadow-lg hover:brightness-110 transition"
                  >
                    💳 Prenumerera via Stripe (Månadskostnad)
                  </a>
                  <button
                    onClick={async () => {
                      setIsSubscriber(true);
                      setAppEdition('premium');
                      try {
                        localStorage.setItem('zp_is_subscriber', 'true');
                        localStorage.setItem('zp_app_edition', 'premium');
                      } catch (e) {}
                      await saveToCloud(favLists, m3uUrl, epgUrl, true);
                      setPaywallModal(false);
                    }}
                    className="w-full py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-[#F3D078]"
                  >
                    ✓ Jag har betalat – Aktivera Royal på mitt konto nu
                  </button>
                  <button
                    onClick={() => setPaywallModal(false)}
                    className="text-xs text-zinc-500 hover:text-white pt-1"
                  >
                    Stäng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VATTENTÄT JURIDISK ANSVARSFRISKRIVNING */}
          {!legalAccepted && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-2xl z-[60] flex items-center justify-center p-4">
              <div className="bg-[#111215] border-2 border-[#F3D078] rounded-3xl w-full max-w-lg p-7 space-y-5 shadow-2xl">
                <div className="flex items-center gap-3 border-b border-white/10 pb-4">
                  <div className="w-10 h-10 rounded-full bg-[#F3D078] text-black font-black text-lg flex items-center justify-center shrink-0">
                    ⚖️
                  </div>
                  <div>
                    <span className="text-[10px] font-black uppercase tracking-widest text-[#F3D078]">JURIDISK ANSVARSFRISKRIVNING</span>
                    <h3 className="text-base sm:text-lg font-black text-white">Användarvillkor för Zappaportalen</h3>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-black/80 border border-white/10 space-y-3 text-xs text-zinc-300 leading-relaxed max-h-64 overflow-y-auto thin-scrollbar">
                  <p>
                    <strong className="text-white">1. Neutral Teknisk Mediaspelare:</strong> Zappaportalen (<code className="text-[#F3D078]">zappaportalen.se</code>) är uteslutande ett neutralt, tomt tekniskt gränssnitt och mediespelarverktyg (likt VLC eller en vanlig webbläsare).
                  </p>
                  <p>
                    <strong className="text-white">2. Inget Eget Innehåll:</strong> Zappaportalen tillhandahåller, säljer, hostar, lagrar eller distribuerar <strong>inga som helst egna TV-kanaler, strömmar, filmer, serier eller M3U-spellistor</strong>.
                  </p>
                  <p>
                    <strong className="text-white">3. Slutanvändarens Fulla Ansvar:</strong> Utvecklarna och ägarna bakom Zappaportalen tar <strong>inget som helst juridiskt eller upphovsrättsligt ansvar</strong> för hur slutanvändaren väljer att använda spelaren eller vilket material slutanvändaren själv läser in. Genom att använda tjänsten intygar du att du har laglig rätt till de strömmar du spelar upp.
                  </p>
                </div>

                <button
                  onClick={() => {
                    setLegalAccepted(true);
                    try { localStorage.setItem('zp_legal_accepted_v1', 'true'); } catch (e) {}
                  }}
                  style={{ backgroundColor: accentColor }}
                  className="w-full text-black font-extrabold py-3.5 rounded-2xl text-xs shadow-lg hover:brightness-110 transition"
                >
                  ✓ Jag har läst och godkänner villkoren
                </button>
              </div>
            </div>
          )}

          {/* INLOGGNINGS-MODAL MED 1-KLICKS GOOGLE, APPLE & E-POST/LÖSENORD */}
          {authModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
              <div className="bg-[#111215] border border-[#F3D078]/40 rounded-3xl w-full max-w-sm p-7 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-7 h-7 rounded-full bg-[#F3D078] text-black font-black text-xs flex items-center justify-center">Z</div>
                    <h3 className="font-extrabold text-base text-white">{isSignUp ? 'Skapa konto på Zappaportalen' : 'Logga in i Zappaportalen'}</h3>
                  </div>
                  {user && (
                    <button onClick={() => setAuthModal(false)} className="text-sm font-bold text-zinc-400 hover:text-white">
                      ✕
                    </button>
                  )}
                </div>

                <div className="space-y-2.5">
                  <button
                    type="button"
                    onClick={() => handleOAuthLogin('google')}
                    className="w-full bg-white hover:bg-zinc-200 text-black font-extrabold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-2.5 shadow transition"
                  >
                    <span className="font-black text-sm">G</span>
                    <span>Fortsätt med Google (1 klick)</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleOAuthLogin('apple')}
                    className="w-full bg-zinc-900 hover:bg-zinc-800 text-white border border-white/20 font-extrabold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-2.5 shadow transition"
                  >
                    <span className="text-sm"></span>
                    <span>Fortsätt med Apple (1 klick)</span>
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <div className="h-px bg-white/10 flex-1" />
                  <span className="text-[10px] font-bold uppercase text-zinc-500">eller med e-post</span>
                  <div className="h-px bg-white/10 flex-1" />
                </div>

                <form onSubmit={handleAuth} className="space-y-3.5" autoComplete="on">
                  <input
                    ref={emailInputRef}
                    type="email"
                    defaultValue={savedEmailDefault}
                    placeholder="E-postadress"
                    autoComplete="email"
                    className="w-full bg-black border border-white/15 focus:border-[#F3D078] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <input
                    ref={passwordInputRef}
                    type="password"
                    placeholder="Lösenord"
                    autoComplete="current-password"
                    className="w-full bg-black border border-white/15 focus:border-[#F3D078] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <button
                    type="submit"
                    style={{ backgroundColor: accentColor }}
                    className="w-full text-black font-extrabold py-3 rounded-2xl text-xs shadow-lg transition hover:brightness-110"
                  >
                    {isSignUp ? 'Registrera Konto' : 'Logga in'}
                  </button>
                </form>
                <div className="text-center pt-1">
                  <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-[#F3D078] hover:underline font-semibold">
                    {isSignUp ? 'Har du redan konto? Logga in' : 'Inget konto? Skapa ett här'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LÄGG TILL / TA BORT I FAVORITMAPP-MODAL */}
          {favModalItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#121316] border border-[#F3D078]/40 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-sm text-[#F3D078]">★ Hantera favorit: {favModalItem.name}</h3>
                  <button onClick={() => setFavModalItem(null)} className="text-sm font-bold text-zinc-400">
                    ✕
                  </button>
                </div>
                <div className="space-y-2">
                  {favLists.map((list) => {
                    const checked = (list.channelIds || []).includes(favModalItem.id);
                    return (
                      <div
                        key={list.id}
                        onClick={() => toggleChannelInFavList(list.id, favModalItem.id)}
                        className={`p-3.5 rounded-2xl border flex justify-between items-center cursor-pointer transition ${
                          checked ? 'bg-amber-950/60 border-[#F3D078] text-white' : 'bg-black/50 border-white/10 text-zinc-300'
                        }`}
                      >
                        <span className="text-xs font-bold">★ {list.name}</span>
                        <span className="text-xs font-extrabold text-[#F3D078]">{checked ? '✓ Tillagd (Klicka för att ta bort)' : '+ Lägg till'}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* SMARTA FAVORITMAPPAR-MODAL */}
          {manageFavModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#121316] border border-[#F3D078]/40 rounded-3xl w-full max-w-lg p-6 space-y-5 shadow-2xl my-auto">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-base text-[#F3D078]">
                    {editingFavListId ? '🗑 Välj favoriter att ta bort' : '👑 Smarta Favoritmappar'}
                  </h3>
                  <button
                    onClick={() => {
                      setManageFavModal(false);
                      setEditingFavListId(null);
                      setSelectedFavIdsForRemoval(new Set());
                    }}
                    className="text-sm font-bold text-zinc-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {editingFavListId ? (
                  (() => {
                    const activeFolder = favLists.find((f) => f.id === editingFavListId);
                    const folderItems = editingFavListId === 'ALL'
                      ? allFavoriteItemsCombined
                      : (favItemsById[editingFavListId] || []);

                    const toggleSelectId = (id) => {
                      setSelectedFavIdsForRemoval((prev) => {
                        const next = new Set(prev);
                        if (next.has(id)) next.delete(id);
                        else next.add(id);
                        return next;
                      });
                    };

                    const selectAllInView = () => {
                      if (selectedFavIdsForRemoval.size === folderItems.length) {
                        setSelectedFavIdsForRemoval(new Set());
                      } else {
                        setSelectedFavIdsForRemoval(new Set(folderItems.map((x) => x.id)));
                      }
                    };

                    return (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <button
                            onClick={() => {
                              setEditingFavListId(null);
                              setSelectedFavIdsForRemoval(new Set());
                            }}
                            className="text-xs font-bold text-[#F3D078]"
                          >
                            ← Tillbaka till mappar
                          </button>
                          <span className="text-xs font-bold text-zinc-300">
                            {activeFolder ? `Mapp: ${activeFolder.name}` : 'Alla manuella favoriter'} ({folderItems.length} st)
                          </span>
                        </div>

                        {folderItems.length > 0 ? (
                          <>
                            <div className="flex items-center justify-between bg-black/50 p-3 rounded-xl border border-white/10">
                              <button
                                type="button"
                                onClick={selectAllInView}
                                className="text-xs font-bold text-[#F3D078] hover:underline"
                              >
                                {selectedFavIdsForRemoval.size === folderItems.length ? 'Avmarkera alla' : '✓ Markera alla'}
                              </button>
                              <button
                                type="button"
                                disabled={selectedFavIdsForRemoval.size === 0}
                                onClick={() => removeSelectedFavoritesBatch(editingFavListId)}
                                className={`px-4 py-2 rounded-xl text-xs font-extrabold transition ${
                                  selectedFavIdsForRemoval.size > 0
                                    ? 'bg-red-600 hover:bg-red-500 text-white shadow'
                                    : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                                }`}
                              >
                                🗑 Ta bort markerade ({selectedFavIdsForRemoval.size})
                              </button>
                            </div>

                            <div className="space-y-2 max-h-64 overflow-y-auto thin-scrollbar pr-1">
                              {folderItems.map((it) => {
                                const isChecked = selectedFavIdsForRemoval.has(it.id);
                                return (
                                  <div
                                    key={it.id}
                                    onClick={() => toggleSelectId(it.id)}
                                    className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                                      isChecked ? 'bg-red-950/40 border-red-500/60' : 'bg-black/60 border-white/10 hover:border-white/25'
                                    }`}
                                  >
                                    <div className="flex items-center gap-3 min-w-0">
                                      <input
                                        type="checkbox"
                                        checked={isChecked}
                                        onChange={() => {}}
                                        className="w-4 h-4 accent-[#F3D078] rounded cursor-pointer"
                                      />
                                      <div className="min-w-0">
                                        <p className="text-xs font-bold text-white truncate">{it.name}</p>
                                        <p className="text-[10px] text-zinc-400 truncate">{it.group} • {it.type}</p>
                                      </div>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        quickRemoveSingleFavorite(it);
                                      }}
                                      className="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1"
                                    >
                                      🗑 Ta bort
                                    </button>
                                  </div>
                                );
                              })}
                            </div>
                          </>
                        ) : (
                          <p className="text-xs text-zinc-400 text-center py-6">Inga sparade favoriter i denna mapp ännu.</p>
                        )}
                      </div>
                    );
                  })()
                ) : (
                  <>
                    <form onSubmit={handleCreateFavList} className="space-y-3.5 bg-black/60 p-4 rounded-2xl border border-white/10">
                      <p className="text-xs text-[#F3D078] font-bold">Skapa ny mapp (Exakt ord- & kvalitetsmatchning):</p>
                      <input
                        type="text"
                        placeholder="1. Namn på favoritmappen (t.ex. UK FHD)"
                        value={newListName}
                        onChange={(e) => setNewListName(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                        required
                      />
                      <select
                        value={newListGroup}
                        onChange={(e) => setNewListGroup(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                      >
                        <option value="ALL">Alla mappar (eller välj en specifik nedan)</option>
                        {allAvailableGroups.map((grp) => (
                          <option key={grp} value={grp}>📁 {grp}</option>
                        ))}
                      </select>
                      <input
                        type="text"
                        placeholder="3. Exakta sökord (t.ex. UK FHD -> tar BARA med FHD, inte vanlig HD)"
                        value={newListFilter}
                        onChange={(e) => setNewListFilter(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                      />
                      <button
                        type="submit"
                        style={{ backgroundColor: accentColor }}
                        className="w-full text-black font-extrabold py-2.5 rounded-xl text-xs shadow-lg"
                      >
                        + Skapa & Synka Smart Mapp
                      </button>
                    </form>

                    <div className="flex items-center justify-between pt-1">
                      <span className="text-xs font-bold text-zinc-300">Dina mappar:</span>
                      <button
                        type="button"
                        onClick={() => setEditingFavListId('ALL')}
                        className="text-xs font-extrabold text-[#F3D078] hover:underline"
                      >
                        🗑 Rensa / Ta bort enskilda favoriter ({allFavoriteItemsCombined.length})
                      </button>
                    </div>

                    <div className="space-y-2 max-h-52 overflow-y-auto thin-scrollbar">
                      {favLists.map((list) => {
                        const items = favItemsById[list.id] || [];
                        return (
                          <div key={list.id} className="p-3.5 rounded-2xl bg-black/60 border border-white/10 flex justify-between items-center gap-2">
                            <div className="min-w-0 flex-1">
                              <span className="text-xs font-bold text-white block truncate">
                                ★ {list.name} ({items.length} st)
                              </span>
                              {(list.filter || (list.filterGroup && list.filterGroup !== 'ALL')) && (
                                <span className="text-[10px] text-[#F3D078]">
                                  Regel: {list.filterGroup && list.filterGroup !== 'ALL' ? list.filterGroup : 'Alla'}{' '}
                                  {list.filter ? `+ "${list.filter}"` : ''}
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button
                                type="button"
                                onClick={() => setEditingFavListId(list.id)}
                                className="text-xs bg-zinc-800 hover:bg-zinc-700 text-[#F3D078] px-3 py-1.5 rounded-xl font-bold"
                              >
                                Hantera innehåll
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteFavList(list.id)}
                                className="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1.5"
                              >
                                Radera mapp
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* MOBIL BOTTENMENY */}
          {user && (
            <nav className="sm:hidden fixed bottom-0 left-0 right-0 h-14 bg-black/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around z-30 px-1">
              {[
                { id: 'home', label: tr.home, icon: '🏠' },
                { id: 'movies', label: tr.movies, icon: '🎬' },
                { id: 'series', label: tr.series, icon: '🍿' },
                { id: 'vod_channels', label: 'VOD-TV', icon: '🎞️' },
                { id: 'live', label: 'Live', icon: '📺' },
                { id: 'epg', label: 'Guide', icon: '📅' },
                { id: 'settings', label: 'Meny', icon: '⚙️' }
              ].map((t) => {
                const active = activeTab === t.id && !isFullscreenPlayer;
                return (
                  <button
                    key={t.id}
                    onClick={() => {
                      setActiveTab(t.id);
                      setExpandedCategory(null);
                      setIsFullscreenPlayer(false);
                    }}
                    className={`flex flex-col items-center justify-center py-1 px-1.5 ${
                      active ? 'text-[#F3D078] font-extrabold' : 'text-zinc-400'
                    }`}
                  >
                    <span className="text-sm leading-none">{t.icon}</span>
                    <span className="text-[8px] mt-1">{t.label}</span>
                  </button>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

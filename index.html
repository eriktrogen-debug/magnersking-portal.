    async function sendCrashReport(type, message, stack = '', extra = {}) {

        const enabled = localStorage.getItem('zp_crash_reports_enabled');

        const payload = {
          error_type: String(type || 'error'),
          error_message: String(message || 'Okänt fel').substring(0, 1000),
          error_stack: String(stack || '').substring(0, 3000),
          url: window.location.origin + window.location.pathname, // utan query/hash (kan innehålla inloggningstoken)

          platform: navigator.platform || 'unknown',

        } catch (e) {}

        if (supabaseClient) {
          await supabaseClient.from('crash_reports').insert(payload);
        }

        if (CRASH_WEBHOOK_URL) {
          fetch(CRASH_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)

      } catch (err) {
        console.warn('Kunde ej skicka kraschrapport:', err);

    function openLocalDB() {
      return new Promise((resolve, reject) => {
        try {
          if (!window.indexedDB) return reject('IndexedDB stöds ej');
          const req = window.indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {

            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (err) {
          reject(err);
        }
      });
    }

    // --- HJÄLPFUNKTIONER FÖR METADATA, KVALITET & PARSNING ---
    function extractMetadata(name, group, rawExtInf = '') {
      let quality = '';
      if (/(?:^|[^a-z0-9])(4k|uhd|2160p)(?:$|[^a-z0-9])/i.test(name) || /(?:^|[^a-z0-9])(4k|uhd)(?:$|[^a-z0-9])/i.test(group)) quality = '4K';
      else if (/(?:^|[^a-z0-9])(fhd|1080p|1080i)(?:$|[^a-z0-9])/i.test(name)) quality = 'FHD';
      else if (/(?:^|[^a-z0-9])(hd|720p)(?:$|[^a-z0-9])/i.test(name)) quality = 'HD';
      else if (/(?:^|[^a-z0-9])(sd|576p|480p)(?:$|[^a-z0-9])/i.test(name)) quality = 'SD';

      const yearMatch = name.match(/\b(19\d{2}|20[0-2]\d)\b/);
      const year = yearMatch ? yearMatch[1] : null;

      const seMatch = name.match(/^(.*?)\s*[-\s]*S(\d{1,2})\s*E(\d{1,3})/i);
      const seriesTitle = seMatch ? seMatch[1].replace(/[\(\[\-\_]+$/, '').trim() : null;
      const season = seMatch ? parseInt(seMatch[2], 10) : null;
      const episode = seMatch ? parseInt(seMatch[3], 10) : null;

      let addedTimestamp = 0;
      const addedAttr = rawExtInf.match(/(?:added|date|created|timestamp)="([^"]+)"/i);
      if (addedAttr && addedAttr[1]) {
        const parsedNum = Number(addedAttr[1]);
        if (!isNaN(parsedNum) && parsedNum > 100000) {
          addedTimestamp = parsedNum > 1e11 ? parsedNum : parsedNum * 1000;
        } else {
          const parsedDate = Date.parse(addedAttr[1]);
          if (!isNaN(parsedDate)) addedTimestamp = parsedDate;
        }
      }

      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const rating = (7.0 + (Math.abs(hash) % 23) / 10).toFixed(1).replace('.', ',');

      return { quality, year, seriesTitle, season, episode, rating, addedTimestamp };
    }

    function escapeRegexStr(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function matchesSmartFilterRule(item, filterGroup, filterText) {
      const itemGrp = (item.group || '').toLowerCase();
      const itemName = (item.name || '').toLowerCase();
      const itemQuality = (item.quality || '').toUpperCase();
      const combinedHaystack = `${itemName} ${itemGrp}`;

      // 1. Grupp-matchning
      if (filterGroup && filterGroup !== 'ALL') {
        const fg = filterGroup.toLowerCase().trim();
        if (itemGrp !== fg && !itemGrp.includes(fg)) return false;
      }

      // 2. Text/Kvalitets-matchning (uppdelad per ord så att "UK FHD" kräver BÅDE "UK" och exakt "FHD")
      if (filterText && filterText.trim() !== '') {
        const tokens = filterText.toLowerCase().trim().split(/\s+/).filter(Boolean);
        for (const tok of tokens) {
          if (tok === 'fhd' || tok === '1080p') {
            // Krav: Måste vara exakt FHD (inte vanlig HD!)
            const isExactFhd = itemQuality === 'FHD' || /(?:^|[^a-z0-9])(fhd|1080p|1080i)(?:$|[^a-z0-9])/i.test(combinedHaystack);
            if (!isExactFhd) return false;
          } else if (tok === 'hd' || tok === '720p') {
            // Krav: Måste vara exakt HD (inte FHD!)
            const isExactHd = itemQuality === 'HD' || /(?:^|[^a-z0-9])(hd|720p)(?:$|[^a-z0-9])/i.test(combinedHaystack);
            if (!isExactHd) return false;
          } else if (tok === '4k' || tok === 'uhd' || tok === '2160p') {
            const isExact4k = itemQuality === '4K' || /(?:^|[^a-z0-9])(4k|uhd|2160p)(?:$|[^a-z0-9])/i.test(combinedHaystack);
            if (!isExact4k) return false;
          } else if (tok === 'sd') {
            const isExactSd = itemQuality === 'SD' || /(?:^|[^a-z0-9])(sd)(?:$|[^a-z0-9])/i.test(combinedHaystack);
            if (!isExactSd) return false;
          } else if (tok.length <= 3) {
            // Korta landskoder/ord som "uk", "se", "us", "vip" matchas som egna ord så "uk" inte matchar "luke"
            const wordBoundaryRegex = new RegExp(`(?:^|[^a-z0-9åäö])${escapeRegexStr(tok)}(?:$|[^a-z0-9åäö])`, 'i');
            if (!wordBoundaryRegex.test(combinedHaystack)) return false;
          } else {
            if (!combinedHaystack.includes(tok)) return false;
          }
        }
      }

      return true;
    }

    function parseXmltvDate(dateStr) {
      if (!dateStr || dateStr.length < 14) return null;
      const y = parseInt(dateStr.substring(0, 4), 10);
      const m = parseInt(dateStr.substring(4, 6), 10) - 1;
      const d = parseInt(dateStr.substring(6, 8), 10);
      const h = parseInt(dateStr.substring(8, 10), 10);
      const min = parseInt(dateStr.substring(10, 12), 10);
      const s = parseInt(dateStr.substring(12, 14), 10);

      const tzMatch = dateStr.substring(14).trim().match(/^([+-])(\d{2})(\d{2})/);
      if (tzMatch) {
        const sign = tzMatch[1] === '+' ? 1 : -1;
        const tzHours = parseInt(tzMatch[2], 10);
        const tzMins = parseInt(tzMatch[3], 10);
        const offsetMs = sign * (tzHours * 60 + tzMins) * 60 * 1000;
        const utcMs = Date.UTC(y, m, d, h, min, s);
        return new Date(utcMs - offsetMs);
      }
      return new Date(y, m, d, h, min, s);
    }

    function formatTime(dateObj) {
      if (!dateObj) return '';
      const d = dateObj instanceof Date ? dateObj : new Date(dateObj);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    }

    function normalizeChannelKey(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .replace(/^(se|swe|no|dk|fi|uk|us|vip|sport|nordic)[\s:|\-_]+/gi, '')
        .replace(/\b(fhd|uhd|4k|hd|sd|hevc|50fps|raw|se|swe|sweden|backup)\b/gi, '')
        .replace(/\[.*?\]|\(.*?\)/g, '')
        .replace(/[^a-z0-9åäö]/g, '')
        .trim();
    }

    function parseXMLTV(xmlText) {
      if (!xmlText || typeof xmlText !== 'string') return {};
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const epgMap = {};

      const channelEls = xmlDoc.getElementsByTagName('channel');
      const idAliases = {};
      for (let i = 0; i < channelEls.length; i++) {
        const chEl = channelEls[i];
        const idAttr = (chEl.getAttribute('id') || '').toLowerCase().trim();
        if (!idAttr) continue;
        const normId = normalizeChannelKey(idAttr.split('.')[0]);
        if (normId) idAliases[normId] = idAttr;

        const dispEls = chEl.getElementsByTagName('display-name');
        for (let j = 0; j < dispEls.length; j++) {
          const dispName = (dispEls[j].textContent || '').toLowerCase().trim();
          if (dispName) {
            idAliases[dispName] = idAttr;
            const normDisp = normalizeChannelKey(dispName);
            if (normDisp) idAliases[normDisp] = idAttr;
          }
        }
      }

      const programmes = xmlDoc.getElementsByTagName('programme');
      const now = new Date();
      const minPast = new Date(now.getTime() - 2 * 60 * 60 * 1000);
      const maxFuture = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      for (let i = 0; i < programmes.length; i++) {
        const prog = programmes[i];
        const channelId = (prog.getAttribute('channel') || '').toLowerCase().trim();
        if (!channelId) continue;

        const stopDate = parseXmltvDate(prog.getAttribute('stop'));
        if (stopDate && stopDate < minPast) continue;

        const startDate = parseXmltvDate(prog.getAttribute('start'));
        if (startDate && startDate > maxFuture) continue;

        const titleEl = prog.getElementsByTagName('title')[0];
        const descEl = prog.getElementsByTagName('desc')[0];

        const title = titleEl ? titleEl.textContent : 'Okänt program';
        const desc = descEl ? descEl.textContent : '';

        if (!epgMap[channelId]) epgMap[channelId] = [];
        epgMap[channelId].push({ start: startDate, stop: stopDate, title, desc });
      }

      Object.keys(epgMap).forEach((chId) => {
        epgMap[chId].sort((a, b) => a.start - b.start);
        const norm = normalizeChannelKey(chId.split('.')[0]);
        if (norm && !epgMap[norm]) epgMap[norm] = epgMap[chId];
      });

      Object.entries(idAliases).forEach(([aliasName, targetId]) => {
        if (epgMap[targetId] && !epgMap[aliasName]) {
          epgMap[aliasName] = epgMap[targetId];
        }
      });

      return epgMap;
    }

    function parseM3U(content) {
      const lines = content.split('\n');
      const live = [];
      const vodChannels = [];
      const movies = [];
      const series = [];
      let detectedEpgUrl = '';
      
      let currentName = '';
      let currentGroup = 'Övriga kanaler';
      let currentLogo = '';
      let currentTvgId = '';
      let currentTvgName = '';
      let currentRawExtInf = '';
      const seenIds = new Set();
      let orderCounter = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (i === 0 && line.startsWith('#EXTM3U')) {
          const urlTvgMatch = line.match(/(?:url-tvg|x-tvg-url)="([^"]+)"/i);
          if (urlTvgMatch && urlTvgMatch[1]) {
            detectedEpgUrl = urlTvgMatch[1].split(',')[0].trim();
          }
        }

        if (line.startsWith('#EXTINF:')) {
          currentRawExtInf = line;
          const commaIndex = line.lastIndexOf(',');
          currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Okänd kanal';
          
          const groupIdx = line.indexOf('group-title="');
          if (groupIdx !== -1) {
            const start = groupIdx + 13;
            const end = line.indexOf('"', start);
            if (end !== -1) currentGroup = line.substring(start, end);
          }

          const logoIdx = line.indexOf('tvg-logo="');
          if (logoIdx !== -1) {
            const start = logoIdx + 10;
            const end = line.indexOf('"', start);
            if (end !== -1) currentLogo = line.substring(start, end);
          }

          const idIdx = line.indexOf('tvg-id="');
          if (idIdx !== -1) {
            const start = idIdx + 8;
            const end = line.indexOf('"', start);
            if (end !== -1) currentTvgId = line.substring(start, end);
          }

          const nameIdx = line.indexOf('tvg-name="');
          if (nameIdx !== -1) {
            const start = nameIdx + 10;
            const end = line.indexOf('"', start);
            if (end !== -1) currentTvgName = line.substring(start, end);
          }
        } else if (line[0] !== '#') {
          orderCounter += 1;
          const lowerGroup = currentGroup.toLowerCase();
          const lowerUrl = line.toLowerCase();
          const lowerName = currentName.toLowerCase();

          let baseId = 'id_' + (currentGroup + '_' + currentName).toLowerCase().replace(/[^a-z0-9]/g, '');
          let uniqueId = baseId;
          let counter = 1;
          while (seenIds.has(uniqueId)) {
            uniqueId = `${baseId}_${counter++}`;
          }
          seenIds.add(uniqueId);

          const meta = extractMetadata(currentName, currentGroup, currentRawExtInf);

          const hasVideoFileExtension = /\.(mp4|mkv|avi|mov|webm|m4v|flv)(\?.*)?$/i.test(lowerUrl);
          const isSeriesUrlOrPattern =
            lowerUrl.includes('/series/') ||
            /s\d{1,2}\s*e\d{1,3}/i.test(lowerName) ||
            ((lowerGroup.includes('serie') || lowerGroup.includes('series')) && hasVideoFileExtension);

          const isMovieFileOrUrl =
            !isSeriesUrlOrPattern &&
            (lowerUrl.includes('/movie/') ||
              lowerUrl.includes('/movies/') ||
              (hasVideoFileExtension && !lowerUrl.endsWith('.ts') && !lowerUrl.includes('.m3u8')));

          const isVodChannelPattern =
            !isSeriesUrlOrPattern &&
            !isMovieFileOrUrl &&
            (lowerGroup.includes('24/7') ||
              lowerGroup.includes('24-7') ||
              lowerGroup.includes('vod') ||
              lowerGroup.includes('box office') ||
              lowerGroup.includes('ppv') ||
              lowerGroup.includes('cinema') ||
              lowerGroup.includes('filmkanal') ||
              lowerGroup.includes('movie channel') ||
              lowerName.includes('24/7') ||
              lowerName.includes('vod:'));

          let itemType = 'live';
          if (isSeriesUrlOrPattern) itemType = 'series';
          else if (isMovieFileOrUrl) itemType = 'movies';
          else if (isVodChannelPattern) itemType = 'vod_channel';

          const addedScore = meta.addedTimestamp > 0 ? meta.addedTimestamp : orderCounter;

          const item = {
            id: uniqueId,
            tvgId: (currentTvgId || currentTvgName || currentName).toLowerCase(),
            name: currentName,
            group: currentGroup || 'Övriga kanaler',
            logo: currentLogo,
            url: line,
            type: itemType,
            quality: meta.quality,
            year: meta.year,
            rating: meta.rating,
            seriesTitle: meta.seriesTitle,
            season: meta.season,
            episode: meta.episode,
            addedOrder: addedScore
          };

          if (itemType === 'series') series.push(item);
          else if (itemType === 'movies') movies.push(item);
          else if (itemType === 'vod_channel') vodChannels.push(item);
          else live.push(item);

          currentName = '';
          currentGroup = 'Övriga kanaler';
          currentLogo = '';
          currentTvgId = '';
          currentTvgName = '';
          currentRawExtInf = '';
        }
      }
      return { live, vodChannels, movies, series, detectedEpgUrl };
    }

    const posterCacheMemory = {};

    function cleanMediaTitleForPoster(rawTitle) {
      if (!rawTitle) return '';
      return rawTitle
        .replace(/^(se|swe|en|eng|no|dk|fi|nordic|vip|4k|uhd|fhd|hd)[\s:|\-_]+/gi, '')
        .replace(/s\d{1,2}\s*e\d{1,3}.*$/i, '')
        .replace(/\b(19\d{2}|20[0-2]\d)\b.*$/i, '')
        .replace(/\[.*?\]|\(.*?\)/g, '')
        .replace(/\b(4k|uhd|fhd|1080p|720p|hevc|x264|x265|bluray|web-dl|swesub|multi)\b/gi, '')
        .replace(/[._\-]+/g, ' ')
        .trim();
    }

    function SmartMediaImage({ src, alt, fallbackIcon = '🎬', mode = 'poster', itemType = 'movies' }) {
      const [imgErr, setImgErr] = useState(false);
      const [officialPoster, setOfficialPoster] = useState(null);

      useEffect(() => {
        if ((itemType !== 'movies' && itemType !== 'series') || (src && !imgErr)) return;
        const cleanTitle = cleanMediaTitleForPoster(alt);
        if (!cleanTitle || cleanTitle.length < 2) return;

        if (posterCacheMemory[cleanTitle]) {
          setOfficialPoster(posterCacheMemory[cleanTitle]);
          return;
        }

        let isCancelled = false;
        const entity = itemType === 'series' ? 'tvSeason' : 'movie';
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&entity=${entity}&limit=1`)
          .then((r) => r.json())
          .then((data) => {
            if (isCancelled) return;
            const art = data?.results?.[0]?.artworkUrl100;
            if (art) {
              const hiRes = art.replace('100x100bb', '600x900bb');
              posterCacheMemory[cleanTitle] = hiRes;
              setOfficialPoster(hiRes);
            }
          })
          .catch(() => {});

        return () => { isCancelled = true; };
      }, [src, imgErr, alt, itemType]);

      const activeSrc = !imgErr && src ? src : officialPoster;

      if (!activeSrc) {
        return (
          <div className="absolute inset-0 flex flex-col items-center justify-center p-3 text-center bg-gradient-to-br from-zinc-900 via-[#121318] to-black border-inner border-white/5">

              {cleanMediaTitleForPoster(alt) || alt || 'Zappaportalen'}

        );
      }

      return (

            alt=""
            aria-hidden="true"

          <img
            src={activeSrc}
            alt={alt || ''}
            loading="lazy"
            onError={() => setImgErr(true)}
            className={`relative z-10 w-full h-full transition-transform duration-300 group-hover:scale-[1.02] ${
              mode === 'logo'
                ? 'object-contain p-3'
                : mode === 'landscape'
                ? 'object-contain p-1.5'
                : 'object-cover'
            }`}
          />
        </div>
      );
    }

    // --- HUVUDAPPLIKATION ---
    function App() {
      const [appEdition, setAppEdition] = useState(() => {
        try { return localStorage.getItem('zp_app_edition') || DEFAULT_APP_EDITION; } catch (e) { return DEFAULT_APP_EDITION; }

      const [isSubscriber, setIsSubscriber] = useState(() => {
        try { return localStorage.getItem('zp_is_subscriber') === 'true'; } catch (e) { return false; }
      });
      const [paywallModal, setPaywallModal] = useState(false);

      // Zapp-räknare & 5-sekunders Reklampaus vid zappning i gratisversionen
      const [zapCounter, setZapCounter] = useState(0);
      const [zapAdCountdown, setZapAdCountdown] = useState(0);
      const [pendingZapChannel, setPendingZapChannel] = useState(null);

      // Språk (sv, en, de)
      const [lang, setLang] = useState(() => {
        try { return localStorage.getItem('zp_lang') || 'sv'; } catch (e) { return 'sv'; }
      });
      const tr = I18N[lang] || I18N.sv;

      // Vattentät Juridisk Ansvarsfriskrivning vid första start
      const [legalAccepted, setLegalAccepted] = useState(() => {
        try { return localStorage.getItem('zp_legal_accepted_v1') === 'true'; } catch (e) { return false; }
      });

      const [annoyingAdPopup, setAnnoyingAdPopup] = useState(false);

      const [user, setUser] = useState(null);
      const [isSignUp, setIsSignUp] = useState(false);
      const [authModal, setAuthModal] = useState(true);

      const emailInputRef = useRef(null);
      const passwordInputRef = useRef(null);

      // Medielistor
      const [channels, setChannels] = useState(INITIAL_CHANNELS);
      const [vodChannels, setVodChannels] = useState([]);
      const [movies, setMovies] = useState([]);
      const [series, setSeries] = useState([]);
      const [favLists, setFavLists] = useState(DEFAULT_FAV_LISTS);

      const [watchHistory, setWatchHistory] = useState([]);
      const [watchProgress, setWatchProgress] = useState({});

      // EPG & Mappväljare i TV-guide
      const [epgData, setEpgData] = useState({});
      const [epgUrl, setEpgUrl] = useState(() => {
        try { return localStorage.getItem('zp_saved_epg_url') || ''; } catch (e) { return ''; }
      });
      const [epgStatus, setEpgStatus] = useState('');
      const [isEpgLoading, setIsEpgLoading] = useState(false);
      const [epgSearch, setEpgSearch] = useState('');
      const [epgSelectedFolder, setEpgSelectedFolder] = useState('ALL');

      // Navigering
      const [activeTab, setActiveTab] = useState('home');
      const [currentMedia, setCurrentMedia] = useState(null);
      const [isFullscreenPlayer, setIsFullscreenPlayer] = useState(false);

      // Filter & Kategorier
      const [expandedCategory, setExpandedCategory] = useState(null);
      const [selectedLiveGroup, setSelectedLiveGroup] = useState('ALL');
      const [selectedVodChGroup, setSelectedVodChGroup] = useState('ALL');
      const [searchModal, setSearchModal] = useState(false);
      const [globalSearch, setGlobalSearch] = useState('');
      const [renderLimit, setRenderLimit] = useState(80);

      // Serie-detaljvy
      const [detailItem, setDetailItem] = useState(null);
      const [selectedSeason, setSelectedSeason] = useState(1);

      // Spelare & Utseende
      const [playerEngine, setPlayerEngine] = useState('auto');
      const [tvMode, setTvMode] = useState(false);
      const [accentTheme, setAccentTheme] = useState('aik');
      const [copyFeedback, setCopyFeedback] = useState(false);
      const [externalPlayerNotice, setExternalPlayerNotice] = useState('');
      const [quickDrawer, setQuickDrawer] = useState(false);

      // Favorit-hantering
      const [favModalItem, setFavModalItem] = useState(null);
      const [manageFavModal, setManageFavModal] = useState(false);
      const [newListName, setNewListName] = useState('');
      const [newListGroup, setNewListGroup] = useState('ALL');
      const [newListFilter, setNewListFilter] = useState('');
      const [editingFavListId, setEditingFavListId] = useState(null);
      const [selectedFavIdsForRemoval, setSelectedFavIdsForRemoval] = useState(new Set());

      // Källor, Synk mellan Dator & Mobil
      const [savedM3uUrl, setSavedM3uUrl] = useState(() => {
        try { return localStorage.getItem('zp_saved_m3u_url') || ''; } catch (e) { return ''; }
      });
      const [m3uUrl, setM3uUrl] = useState(() => {
        try { return localStorage.getItem('zp_saved_m3u_url') || ''; } catch (e) { return ''; }
      });
      const [isM3uLoading, setIsM3uLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');
      const [needsDeviceSyncReload, setNeedsDeviceSyncReload] = useState(false);
      const [settingsSubView, setSettingsSubView] = useState(null);

      // Kraschrapport-inställning
      const [crashReportingEnabled, setCrashReportingEnabled] = useState(() => {
        try { return localStorage.getItem('zp_crash_reports_enabled') !== 'false'; } catch (e) { return true; }
      });
      const [crashTestFeedback, setCrashTestFeedback] = useState('');

      const videoRef = useRef(null);
      const [videoError, setVideoError] = useState(null);

      const accentColor = accentTheme === 'aik' ? '#F3D078' : '#D4A346';

      // ============================================================================
      // AUTOMATISK STRIPE RETURN-DETEKTOR (?royal_success=true)
      // ============================================================================
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('royal_success') === 'true') {
          setIsSubscriber(true);
          setAppEdition('premium');
          try {
            localStorage.setItem('zp_is_subscriber', 'true');
            localStorage.setItem('zp_app_edition', 'premium');
          } catch (e) {}
          window.history.replaceState({}, document.title, window.location.pathname);
          alert('👑 Tack för ditt köp! Zappaportalen Royal är nu aktiverat – all reklam och alla zapp-avbrott är borttagna!');
        }
      }, []);

      // Nedräkning för 5-sekunders Zapp-reklampaus i gratisversionen
      useEffect(() => {
        if (zapAdCountdown <= 0) {
          if (pendingZapChannel) {
            const target = pendingZapChannel;
            setPendingZapChannel(null);
            setCurrentMedia(target);
          }
          return;
        }
        const timer = setTimeout(() => {
          setZapAdCountdown((prev) => prev - 1);
        }, 1000);
        return () => clearTimeout(timer);
      }, [zapAdCountdown, pendingZapChannel]);

      // Tidsstyrd påminnelse var 10:e minut i gratisversionen ('free')
      useEffect(() => {
        if (appEdition !== 'free' || isSubscriber) return;
        const interval = setInterval(() => {
          setAnnoyingAdPopup(true);
        }, 10 * 60 * 1000);
        return () => clearInterval(interval);
      }, [appEdition, isSubscriber]);

      useEffect(() => {
        try {
          if (m3uUrl) localStorage.setItem('zp_saved_m3u_url', m3uUrl);
        } catch (e) {}
      }, [m3uUrl]);

      useEffect(() => {
        try {
          if (epgUrl) localStorage.setItem('zp_saved_epg_url', epgUrl);
        } catch (e) {}
      }, [epgUrl]);

      useEffect(() => {
        if (!supabaseClient) return;
        supabaseClient.auth.getUser().then(({ data }) => {
          if (data?.user) {
            setUser(data.user);
            setAuthModal(false);
            loadUserData(data.user.id);
          } else {
            setAuthModal(true);
          }
        }).catch(() => {});

        const { data: authListener } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session?.user) {
            setUser(session.user);
            setAuthModal(false);
            loadUserData(session.user.id);
          } else {
            setUser(null);
            setChannels(INITIAL_CHANNELS);
            setVodChannels([]);
            setMovies([]);
            setSeries([]);
            setAuthModal(true);
          }
        });

        return () => {
          authListener?.subscription?.unsubscribe();
        };
      }, []);

      async function loadUserData(userId) {
        let hasLocalMedia = false;

        const cachedMedia = await loadLocalCache(`media_${userId}`);
        if (cachedMedia && (cachedMedia.channels?.length > 2 || cachedMedia.movies?.length > 0 || cachedMedia.series?.length > 0)) {
          hasLocalMedia = true;
          if (cachedMedia.channels?.length) setChannels(cachedMedia.channels);
          if (cachedMedia.vodChannels) setVodChannels(cachedMedia.vodChannels);
          if (cachedMedia.movies) setMovies(cachedMedia.movies);
          if (cachedMedia.series) setSeries(cachedMedia.series);
          if (cachedMedia.m3uUrl) {
            setSavedM3uUrl(cachedMedia.m3uUrl);
            setM3uUrl(cachedMedia.m3uUrl);
          }
          if (cachedMedia.epgUrl) setEpgUrl(cachedMedia.epgUrl);
          setStatusMsg(
            `Spellista redo på denna enhet: ${cachedMedia.channels?.length || 0} livekanaler, ${cachedMedia.vodChannels?.length || 0} VOD-kanaler, ${cachedMedia.movies?.length || 0} filmer, ${cachedMedia.series?.length || 0} serieavsnitt.`
          );
        }

        const cachedEpg = await loadLocalCache(`epg_${userId}`);
        if (cachedEpg && Object.keys(cachedEpg).length > 0) {
          setEpgData(cachedEpg);
        }

        const cachedHistory = await loadLocalCache(`history_${userId}`);
        if (cachedHistory) {
          if (cachedHistory.watchHistory) setWatchHistory(cachedHistory.watchHistory);
          if (cachedHistory.watchProgress) setWatchProgress(cachedHistory.watchProgress);
        }

        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from('user_settings')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

          if (!error && data) {
            if (Array.isArray(data.fav_lists) && data.fav_lists.length > 0) {
              setFavLists(data.fav_lists);
            } else if (data.fav_lists && typeof data.fav_lists === 'object') {
              if (Array.isArray(data.fav_lists.lists)) setFavLists(data.fav_lists.lists);
              if (data.fav_lists.m3uUrl && !m3uUrl) {
                setM3uUrl(data.fav_lists.m3uUrl);
                setSavedM3uUrl(data.fav_lists.m3uUrl);
              }
              if (data.fav_lists.epgUrl && !epgUrl) {
                setEpgUrl(data.fav_lists.epgUrl);
              }
            }

            if (data.m3u_url) {
              setM3uUrl(data.m3u_url);
              setSavedM3uUrl(data.m3u_url);
              try { localStorage.setItem('zp_saved_m3u_url', data.m3u_url); } catch (e) {}
            }
            if (data.epg_url) {
              setEpgUrl(data.epg_url);
              try { localStorage.setItem('zp_saved_epg_url', data.epg_url); } catch (e) {}
            }

            if (typeof data.is_subscriber === 'boolean') {
              setIsSubscriber(data.is_subscriber);
              try { localStorage.setItem('zp_is_subscriber', String(data.is_subscriber)); } catch (e) {}
              if (data.is_subscriber) {
                setAppEdition('premium');
                try { localStorage.setItem('zp_app_edition', 'premium'); } catch (e) {}
              }
            } else if (localStorage.getItem('zp_is_subscriber') === 'true') {
              saveToCloud(data.fav_lists || favLists, data.m3u_url || m3uUrl, data.epg_url || epgUrl, true);
            }

            const cloudM3u = data.m3u_url || localStorage.getItem('zp_saved_m3u_url') || '';
            const cloudEpg = data.epg_url || localStorage.getItem('zp_saved_epg_url') || '';
            if (!hasLocalMedia && (cloudM3u || cloudEpg)) {
              setNeedsDeviceSyncReload(true);
            }
          }
        } catch (err) {
          console.error('Molnfel:', err);
        }
      }

      async function saveToCloud(lists, customM3u = m3uUrl, customEpg = epgUrl, customSub = isSubscriber) {
        if (!supabaseClient || !user) return;
        try {
          const { error } = await supabaseClient.from('user_settings').upsert({
            user_id: user.id,
            fav_lists: lists,
            m3u_url: customM3u || savedM3uUrl || '',
            epg_url: customEpg || epgUrl || '',
            is_subscriber: customSub,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

          if (error) {
            await supabaseClient.from('user_settings').upsert({
              user_id: user.id,
              fav_lists: lists,
              updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });
          }
        } catch (err) {
          console.error('Kunde ej synka till molnet:', err);
        }
      }

      const startPlayback = (item, openFull = true) => {
        if (!item) return;
        if (appEdition === 'premium' && !isSubscriber) {
          setPaywallModal(true);
          return;
        }
        setCurrentMedia(item);
        if (openFull) setIsFullscreenPlayer(true);
        setDetailItem(null);

        setWatchHistory((prev) => {
          const filtered = prev.filter((x) => x.id !== item.id);
          const updated = [item, ...filtered].slice(0, 25);
          if (user) {
            saveLocalCache(`history_${user.id}`, { watchHistory: updated, watchProgress });
          }
          return updated;
        });
      };

      const handleTimeUpdate = () => {
        const video = videoRef.current;
        if (!video || !currentMedia || currentMedia.type === 'live' || currentMedia.type === 'vod_channel') return;
        if (video.currentTime > 5 && video.duration > 30) {
          setWatchProgress((prev) => {
            const next = {
              ...prev,
              [currentMedia.id]: {
                time: Math.floor(video.currentTime),
                duration: Math.floor(video.duration),
                updated: Date.now()
              }
            };
            if (user && Math.floor(video.currentTime) % 10 === 0) {
              saveLocalCache(`history_${user.id}`, { watchHistory, watchProgress: next });
            }
            return next;
          });
        }
      };

      // --- 1-KLICKS DIREKUPPSPELNING I FÖNSTRET ---
      useEffect(() => {
        const video = videoRef.current;
        const rawMediaUrl = currentMedia?.url?.trim();
        if (!video || !rawMediaUrl || !user || zapAdCountdown > 0) return;

        setVideoError(null);
        let hls = null;
        let mpegtsPlayer = null;
        let isCancelled = false;

        const cleanUp = () => {
          if (hls) {
            try { hls.destroy(); } catch (e) {}
            hls = null;
          }
          if (mpegtsPlayer) {
            try {
              mpegtsPlayer.pause();
              mpegtsPlayer.unload();
              mpegtsPlayer.detachMediaElement();
              mpegtsPlayer.destroy();
            } catch (e) {}
            mpegtsPlayer = null;
          }
          video.removeAttribute('src');
          video.load();
        };

        cleanUp();

        const applySavedTime = () => {
          const saved = watchProgress[currentMedia.id];
          if (saved && saved.time > 10 && currentMedia.type !== 'live' && currentMedia.type !== 'vod_channel') {
            video.currentTime = saved.time;
          }
        };

        const buildCandidateQueue = (url, engineMode) => {
          const queue = [];
          const lower = url.toLowerCase();
          const isDirectVodFile = /\.(mp4|mkv|avi|mov|webm)(\?.*)?$/i.test(lower);
          const isM3u8 = lower.includes('.m3u8');

          let m3u8Variant = null;
          const xtreamLiveMatch = url.match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)(?:\.ts|\.m3u8)?$/i);
          if (xtreamLiveMatch) {
            const [, origin, u, p, streamId] = xtreamLiveMatch;
            m3u8Variant = `${origin}/live/${u}/${p}/${streamId}.m3u8`;
          } else if (lower.endsWith('.ts')) {
            m3u8Variant = url.replace(/\.ts$/i, '.m3u8');
          }

          const wrapCors1 = (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`;
          const wrapCors2 = (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
          const wrapCors3 = (target) => `https://thingproxy.freeboard.io/fetch/${target}`;

          const isHttpOnHttps = window.location.protocol === 'https:' && url.startsWith('http://');

          if (engineMode === 'native' || isDirectVodFile) {
            if (!isHttpOnHttps) queue.push({ type: 'native', url });
            queue.push({ type: 'native', url: wrapCors1(url) });
            queue.push({ type: 'native', url: url });
            return queue;
          }

          if (engineMode === 'hls') {
            if (m3u8Variant && !isHttpOnHttps) queue.push({ type: 'hls', url: m3u8Variant });
            if (!isHttpOnHttps) queue.push({ type: 'hls', url });
            if (m3u8Variant) {
              queue.push({ type: 'hls', url: wrapCors1(m3u8Variant) });
              queue.push({ type: 'hls', url: wrapCors2(m3u8Variant) });
            }
            queue.push({ type: 'hls', url: wrapCors1(url) });
            queue.push({ type: 'hls', url: wrapCors2(url) });
            return queue;
          }

          if (engineMode === 'mpegts') {
            if (!isHttpOnHttps) queue.push({ type: 'mpegts', url });
            queue.push({ type: 'mpegts', url: wrapCors1(url) });
            queue.push({ type: 'mpegts', url: wrapCors3(url) });
            return queue;
          }

          if (isM3u8) {
            if (!isHttpOnHttps) queue.push({ type: 'hls', url });
            queue.push({ type: 'hls', url: wrapCors1(url) });
            queue.push({ type: 'hls', url: wrapCors2(url) });
            queue.push({ type: 'native', url: wrapCors1(url) });
            if (isHttpOnHttps) queue.push({ type: 'hls', url });
          } else {
            if (m3u8Variant) {
              if (!isHttpOnHttps) queue.push({ type: 'hls', url: m3u8Variant });
              queue.push({ type: 'hls', url: wrapCors1(m3u8Variant) });
              queue.push({ type: 'hls', url: wrapCors2(m3u8Variant) });
            }
            if (!isHttpOnHttps) queue.push({ type: 'mpegts', url });
            queue.push({ type: 'mpegts', url: wrapCors1(url) });
            queue.push({ type: 'mpegts', url: wrapCors3(url) });
            if (m3u8Variant) queue.push({ type: 'hls', url: m3u8Variant });
            queue.push({ type: 'mpegts', url });
            queue.push({ type: 'native', url });
          }

          return queue;
        };

        const candidates = buildCandidateQueue(rawMediaUrl, playerEngine);
        let currentIdx = 0;

        const tryNextCandidate = () => {
          if (isCancelled) return;
          cleanUp();

          if (currentIdx >= candidates.length) {
            setVideoError(
              'Strömmen svarar inte i webbläsaren just nu (antingen är sändningen tillfälligt nere hos leverantören eller så blockerar leverantören proxy-tunnlar). Klicka på knappen nedan för att testa strömmen direkt!'
            );
            return;
          }

          const candidate = candidates[currentIdx++];
          const targetUrl = candidate.url;

          if (candidate.type === 'hls') {
            if (window.Hls && window.Hls.isSupported()) {
              hls = new window.Hls({
                enableWorker: true,
                lowLatencyMode: true,
                manifestLoadingTimeOut: 6500,
                manifestLoadingMaxRetry: 1,
                levelLoadingTimeOut: 6500
              });
              hls.loadSource(targetUrl);
              hls.attachMedia(video);

              hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                if (isCancelled) return;
                applySavedTime();
                video.play().catch(() => {});
              });

              hls.on(window.Hls.Events.ERROR, (event, data) => {
                if (data.fatal && !isCancelled) {
                  tryNextCandidate();
                }
              });
            } else {
              tryNextCandidate();
            }
          } else if (candidate.type === 'mpegts') {
            if (window.mpegts && window.mpegts.isSupported()) {
              try {
                mpegtsPlayer = window.mpegts.createPlayer(
                  {
                    type: 'mpegts',
                    isLive: currentMedia.type === 'live' || currentMedia.type === 'vod_channel',
                    url: targetUrl,
                    cors: true
                  },
                  {
                    enableWorker: true,
                    lazyLoadMaxDuration: 3 * 60,
                    seekType: 'range',
                    liveBufferLatencyChasing: true
                  }
                );
                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();
                mpegtsPlayer.play().catch(() => {});

                let hasStartedPlaying = false;
                const onPlaying = () => { hasStartedPlaying = true; };
                video.addEventListener('playing', onPlaying, { once: true });

                const timeoutId = setTimeout(() => {
                  if (!hasStartedPlaying && !isCancelled) {
                    tryNextCandidate();
                  }
                }, 5500);

                mpegtsPlayer.on(window.mpegts.Events.ERROR, () => {
                  clearTimeout(timeoutId);
                  if (!isCancelled) tryNextCandidate();
                });
              } catch (err) {
                tryNextCandidate();
              }
            } else {
              tryNextCandidate();
            }
          } else {
            video.src = targetUrl;
            video.addEventListener('loadedmetadata', applySavedTime, { once: true });
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                if (!isCancelled) tryNextCandidate();
              });
            }
            video.onerror = () => {
              if (!isCancelled) tryNextCandidate();
            };
          }
        };

        tryNextCandidate();

        return () => {
          isCancelled = true;
          cleanUp();
        };
      }, [currentMedia, user, playerEngine, zapAdCountdown]);

      const getChannelEpg = (ch) => {
        if (!ch || Object.keys(epgData).length === 0) return null;
        const cleanName = ch.name.toLowerCase().replace(/\s+(hd|fhd|uhd|4k|se|uk|us|\[\-?\d+h\])$/gi, '').trim();
        const normKey = normalizeChannelKey(ch.name);
        const normTvg = normalizeChannelKey((ch.tvgId || '').split('.')[0]);
        const progList = epgData[ch.tvgId] || epgData[ch.name.toLowerCase()] || epgData[cleanName] || epgData[normKey] || epgData[normTvg];
        if (!progList || progList.length === 0) return null;

        const now = new Date();
        let currentProg = null;
        let nextProg = null;

        for (let i = 0; i < progList.length; i++) {
          const p = progList[i];
          const start = p.start instanceof Date ? p.start : new Date(p.start);
          const stop = p.stop instanceof Date ? p.stop : new Date(p.stop);
          if (start <= now && stop >= now) {
            currentProg = { ...p, start, stop };
            nextProg = progList[i + 1] ? { ...progList[i + 1], start: new Date(progList[i + 1].start), stop: new Date(progList[i + 1].stop) } : null;
            break;
          } else if (start > now) {
            nextProg = { ...p, start, stop };
            break;
          }
        }

        let progress = 0;
        if (currentProg && currentProg.start && currentProg.stop) {
          const total = currentProg.stop - currentProg.start;
          const elapsed = now - currentProg.start;
          if (total > 0) progress = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        }

        return { currentProg, nextProg, progress };
      };

      // --- GRUPPERING AV SERIER + SENASTE UPPLADDADE AVSNITT ---
      const groupedSeriesCatalog = useMemo(() => {

              name: ep.seriesTitle || ep.name,
              isSeriesShow: true,
              episodes: [],
              episodeCount: 0,
              latestAddedOrder: ep.addedOrder || 0
            };
            showMap[showKey] = showObj;
            shows.push(showObj);
          }
          showMap[showKey].episodes.push(ep);
          showMap[showKey].episodeCount += 1;
          if ((ep.addedOrder || 0) > showMap[showKey].latestAddedOrder) {
            showMap[showKey].latestAddedOrder = ep.addedOrder;
          }
        });
        return shows;
      }, [series]);

      const movieGroups = useMemo(() => {

      // ============================================================================

      const currentZapPlaylist = useMemo(() => {
        if (!currentMedia) return channels;

      const zapToChannel = (directionOrItem) => {
        if (!currentZapPlaylist.length) return;
        let nextItem = null;
        let nextIdx = 0;

        if (typeof directionOrItem === 'number') {
          const baseIdx = currentZapIndex !== -1 ? currentZapIndex : 0;
          nextIdx = (baseIdx + directionOrItem + currentZapPlaylist.length) % currentZapPlaylist.length;
          nextItem = currentZapPlaylist[nextIdx];
        } else {
          nextItem = directionOrItem;
          nextIdx = currentZapPlaylist.findIndex((c) => c.id === nextItem?.id);
        }

        if (!nextItem) return;

        // Visa snygg TV-OSD-banner uppe i spelaren vid zappning
        setZapBannerInfo({
          number: nextIdx >= 0 ? nextIdx + 1 : 1,
          total: currentZapPlaylist.length,
          channel: nextItem
        });
        setTimeout(() => {
          setZapBannerInfo((prev) => (prev?.channel?.id === nextItem.id ? null : prev));
        }, 3200);

        // I Gratisversionen ('free'): Var 4:e zappning triggar ett 5-sekunders sponsrat zapp-avbrott!
        if (appEdition === 'free' && !isSubscriber) {

          setZapCounter(nextCount);
          if (nextCount % 4 === 0) {

        }

      // Stöd för fjärrkontroll / piltangenter i fullskärmsspelaren

          if (e.key === 'ArrowUp' || e.key === 'ChannelUp') {
            e.preventDefault();
            zapToChannel(1);
          } else if (e.key === 'ArrowDown' || e.key === 'ChannelDown') {
            e.preventDefault();
            zapToChannel(-1);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);

      const heroItem = useMemo(() => {
        if (activeTab === 'movies' && recentlyAddedMovies.length > 0) return recentlyAddedMovies[0];

        if (recentlyAddedSeries.length > 0) return recentlyAddedSeries[0];

            };

        };

      const handleDeleteFavList = (id) => {

      };

      const handleOAuthLogin = async (provider) => {
        if (!supabaseClient) return alert('Supabase är inte initierat.');
        try {
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider,
            options: { redirectTo: window.location.origin + window.location.pathname }
          });
          if (error) alert(`Kunde ej starta ${provider}-inloggning: ` + error.message);
        } catch (err) {
          alert('Fel vid social inloggning: ' + err.message);

      const handleAuth = async (e) => {
        e.preventDefault();
        if (!supabaseClient) return;
        const emailVal = emailInputRef.current?.value?.trim() || '';
        const passVal = passwordInputRef.current?.value || '';
        if (!emailVal || !passVal) return alert('Fyll i både e-post och lösenord.');

        if (isSignUp) {

      const handleLogout = async () => {

      const downloadSingleM3U = (item = currentMedia) => {
        if (!item?.url) return;
        const cleanUrl = item.url.trim();
        const m3uContent = `#EXTM3U\n#EXTINF:-1 tvg-logo="${item.logo || ''}" group-title="${item.group || ''}",${item.name}\n${cleanUrl}\n`;
        const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${(item.name || 'stream').replace(/[^a-z0-9]/gi, '_')}.m3u`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const openInExternalPlayer = (scheme, item = currentMedia) => {
        const rawUrl = item?.url?.trim();
        if (!rawUrl) {
          alert('Ingen strömlänk hittades för denna kanal.');
          return;
        }

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        let targetUri = '';

        if (scheme === 'vlc') {
          if (isIOS) {
            targetUri = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}`;
          } else if (isAndroid) {
            const noProto = rawUrl.replace(/^https?:\/\//i, '');
            const proto = rawUrl.startsWith('https') ? 'https' : 'http';
            targetUri = `intent://${noProto}#Intent;scheme=${proto};package=org.videolan.vlc;type=video/*;end`;
          } else {
            targetUri = `vlc://${rawUrl}`;
          }
        } else if (scheme === 'potplayer') {
          targetUri = `potplayer://${rawUrl}`;
        } else if (scheme === 'iina') {
          targetUri = `iina://weblink?url=${encodeURIComponent(rawUrl)}`;
        }

        setExternalPlayerNotice(`Öppnar ${scheme.toUpperCase()}... (Om inget händer laddas en .m3u-fil ner som du kan dubbelklicka på)`);
        setTimeout(() => setExternalPlayerNotice(''), 4500);

        try {
          const a = document.createElement('a');
          a.href = targetUri;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (err) {
          downloadSingleM3U(item);

      };

      const copyStreamUrl = async (item = currentMedia) => {

        if (!textToCopy) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(textToCopy);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

          setCopyFeedback(true);
          setTimeout(() => setCopyFeedback(false), 2500);

          prompt('Kopiera strömlänken nedan:', textToCopy);

                  </div>
                  {user && (
                    <button onClick={() => setAuthModal(false)} className="text-sm font-bold text-zinc-400 hover:text-white">
                      ✕
                    </button>
                  )}
                </div>

                <div className="p-3.5 bg-black/60 border border-white/10 rounded-2xl">
                  <p className="text-[11px] text-zinc-400 leading-relaxed text-center">
                    <strong className="text-[#F3D078]">Användarvillkor (zappaportalen.se):</strong> Zappaportalen tillhandahåller enbart en neutral mediaspelare. Användaren ansvarar fullt ut för att endast använda lagliga M3U-filer och strömmar.
                  </p>
                </div>

                <form onSubmit={handleAuth} className="space-y-3.5" autoComplete="on">
                  <input
                    ref={emailInputRef}
                    type="email"
                    defaultValue={savedEmailDefault}
                    placeholder="E-postadress"
                    autoComplete="email"
                    className="w-full bg-black border border-white/15 focus:border-[#F3D078] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <input
                    ref={passwordInputRef}
                    type="password"
                    placeholder="Lösenord"
                    autoComplete="current-password"
                    className="w-full bg-black border border-white/15 focus:border-[#F3D078] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <button
                    type="submit"
                    style={{ backgroundColor: accentColor }}
                    className="w-full text-black font-extrabold py-3 rounded-2xl text-xs shadow-lg transition hover:brightness-110"
                  >
                    {isSignUp ? 'Registrera Konto' : 'Logga in'}
                  </button>
                </form>
                <div className="text-center pt-1">
                  <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-[#F3D078] hover:underline font-semibold">
                    {isSignUp ? 'Har du redan konto? Logga in' : 'Inget konto? Skapa ett här'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LÄGG TILL / TA BORT I FAVORITMAPP-MODAL */}
          {favModalItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#121316] border border-[#F3D078]/40 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-sm text-[#F3D078]">★ Hantera favorit: {favModalItem.name}</h3>
                  <button onClick={() => setFavModalItem(null)} className="text-sm font-bold text-zinc-400">
                    ✕
                  </button>
                </div>
                <div className="space-y-2">
                  {favLists.map((list) => {
                    const checked = (list.channelIds || []).includes(favModalItem.id);
                    return (
                      <div
                        key={list.id}
                        onClick={() => toggleChannelInFavList(list.id, favModalItem.id)}
                        className={`p-3.5 rounded-2xl border flex justify-between items-center cursor-pointer transition ${
                          checked ? 'bg-amber-950/60 border-[#F3D078] text-white' : 'bg-black/50 border-white/10 text-zinc-300'
                        }`}
                      >
                        <span className="text-xs font-bold">★ {list.name}</span>
                        <span className="text-xs font-extrabold text-[#F3D078]">{checked ? '✓ Tillagd (Klicka för att ta bort)' : '+ Lägg till'}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ============================================================================
              PUNKT 7: SMARTA FAVORITMAPPAR-MODAL MED KRYSSRUTOR FÖR ATT TA BORT 1 ELLER FLERA
          ============================================================================ */}
          {manageFavModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#121316] border border-[#F3D078]/40 rounded-3xl w-full max-w-lg p-6 space-y-5 shadow-2xl my-auto">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-base text-[#F3D078]">
                    {editingFavListId ? '🗑 Välj favoriter att ta bort' : '👑 Smarta Favoritmappar'}
                  </h3>
                  <button
                    onClick={() => {
                      setManageFavModal(false);
                      setEditingFavListId(null);
                      setSelectedFavIdsForRemoval(new Set());
                    }}
                    className="text-sm font-bold text-zinc-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {editingFavListId ? (
                  /* Vy för att markera 1 eller flera favoriter med kryssruta och radera dem */
                  (() => {
                    const activeFolder = favLists.find((f) => f.id === editingFavListId);
                    const folderItems = editingFavListId === 'ALL'
                      ? allFavoriteItemsCombined
                      : (favItemsById[editingFavListId] || []);

                    const toggleSelectId = (id) => {
                      setSelectedFavIdsForRemoval((prev) => {
                        const next = new Set(prev);
                        if (next.has(id)) next.delete(id);
                        else next.add(id);
                        return next;
                      });
                    };

                    const selectAllInView = () => {
                      if (selectedFavIdsForRemoval.size === folderItems.length) {
                        setSelectedFavIdsForRemoval(new Set());
                      } else {
                        setSelectedFavIdsForRemoval(new Set(folderItems.map((x) => x.id)));
                      }
                    };

                    return (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <button
                            onClick={() => {
                              setEditingFavListId(null);
                              setSelectedFavIdsForRemoval(new Set());
                            }}
                            className="text-xs font-bold text-[#F3D078]"
                          >
                            ← Tillbaka till mappar
                          </button>
                          <span className="text-xs font-bold text-zinc-300">
                            {activeFolder ? `Mapp: ${activeFolder.name}` : 'Alla manuella favoriter'} ({folderItems.length} st)
                          </span>
                        </div>

                        {folderItems.length > 0 ? (
                          <>
                            <div className="flex items-center justify-between bg-black/50 p-3 rounded-xl border border-white/10">
                              <button
                                type="button"
                                onClick={selectAllInView}
                                className="text-xs font-bold text-[#F3D078] hover:underline"
                              >
                                {selectedFavIdsForRemoval.size === folderItems.length ? 'Avmarkera alla' : '✓ Markera alla'}
                              </button>
                              <button
                                type="button"
                                disabled={selectedFavIdsForRemoval.size === 0}
                                onClick={() => removeSelectedFavoritesBatch(editingFavListId)}
                                className={`px-4 py-2 rounded-xl text-xs font-extrabold transition ${
                                  selectedFavIdsForRemoval.size > 0
                                    ? 'bg-red-600 hover:bg-red-500 text-white shadow'
                                    : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                                }`}
                              >
                                🗑 Ta bort markerade ({selectedFavIdsForRemoval.size})
                              </button>
                            </div>

                            <div className="space-y-2 max-h-64 overflow-y-auto thin-scrollbar pr-1">
                              {folderItems.map((it) => {
                                const isChecked = selectedFavIdsForRemoval.has(it.id);
                                return (
                                  <div
                                    key={it.id}
                                    onClick={() => toggleSelectId(it.id)}
                                    className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                                      isChecked ? 'bg-red-950/40 border-red-500/60' : 'bg-black/60 border-white/10 hover:border-white/25'
                                    }`}
                                  >
                                    <div className="flex items-center gap-3 min-w-0">
                                      <input
                                        type="checkbox"
                                        checked={isChecked}
                                        onChange={() => {}}
                                        className="w-4 h-4 accent-[#F3D078] rounded cursor-pointer"
                                      />
                                      <div className="min-w-0">
                                        <p className="text-xs font-bold text-white truncate">{it.name}</p>
                                        <p className="text-[10px] text-zinc-400 truncate">{it.group} • {it.type}</p>
                                      </div>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        quickRemoveSingleFavorite(it);
                                      }}
                                      className="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1"
                                    >
                                      🗑 Ta bort
                                    </button>
                                  </div>
                                );
                              })}
                            </div>
                          </>
                        ) : (
                          <p className="text-xs text-zinc-400 text-center py-6">Inga sparade favoriter i denna mapp ännu.</p>
                        )}
                      </div>
                    );
                  })()
                ) : (
                  <>
                    <form onSubmit={handleCreateFavList} className="space-y-3.5 bg-black/60 p-4 rounded-2xl border border-white/10">
                      <p className="text-xs text-[#F3D078] font-bold">Skapa ny mapp (Manuell eller Auto-regel):</p>
                      <input
                        type="text"
                        placeholder="1. Namn på favoritmappen (t.ex. Sverige FHD)"
                        value={newListName}
                        onChange={(e) => setNewListName(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                        required
                      />
                      <select
                        value={newListGroup}
                        onChange={(e) => setNewListGroup(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                      >
                        <option value="ALL">Alla mappar (eller välj en specifik nedan)</option>
                        {allAvailableGroups.map((grp) => (
                          <option key={grp} value={grp}>📁 {grp}</option>
                        ))}
                      </select>
                      <input
                        type="text"
                        placeholder="3. Namn måste innehålla (valfritt, t.ex. FHD, 4K, SVT...)"
                        value={newListFilter}
                        onChange={(e) => setNewListFilter(e.target.value)}
                        className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                      />
                      <button
                        type="submit"
                        style={{ backgroundColor: accentColor }}
                        className="w-full text-black font-extrabold py-2.5 rounded-xl text-xs shadow-lg"
                      >
                        + Skapa & Synka Smart Mapp
                      </button>
                    </form>

                    <div className="flex items-center justify-between pt-1">
                      <span className="text-xs font-bold text-zinc-300">Dina mappar:</span>
                      <button
                        type="button"
                        onClick={() => setEditingFavListId('ALL')}
                        className="text-xs font-extrabold text-[#F3D078] hover:underline"
                      >
                        🗑 Rensa / Ta bort enskilda favoriter ({allFavoriteItemsCombined.length})
                      </button>
                    </div>

                    <div className="space-y-2 max-h-52 overflow-y-auto thin-scrollbar">
                      {favLists.map((list) => {
                        const items = favItemsById[list.id] || [];
                        return (
                          <div key={list.id} className="p-3.5 rounded-2xl bg-black/60 border border-white/10 flex justify-between items-center gap-2">
                            <div className="min-w-0 flex-1">
                              <span className="text-xs font-bold text-white block truncate">
                                ★ {list.name} ({items.length} st)
                              </span>
                              {(list.filter || (list.filterGroup && list.filterGroup !== 'ALL')) && (
                                <span className="text-[10px] text-[#F3D078]">
                                  Regel: {list.filterGroup && list.filterGroup !== 'ALL' ? list.filterGroup : 'Alla'}{' '}
                                  {list.filter ? `+ "${list.filter}"` : ''}
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button
                                type="button"
                                onClick={() => setEditingFavListId(list.id)}
                                className="text-xs bg-zinc-800 hover:bg-zinc-700 text-[#F3D078] px-3 py-1.5 rounded-xl font-bold"
                              >
                                Hantera innehåll
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteFavList(list.id)}
                                className="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1.5"
                              >
                                Radera mapp
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* MOBIL BOTTENMENY */}
          {user && (
            <nav className="sm:hidden fixed bottom-0 left-0 right-0 h-14 bg-black/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around z-30 px-1">
              {[
                { id: 'home', label: 'För dig', icon: '🏠' },
                { id: 'movies', label: 'Filmer', icon: '🎬' },
                { id: 'series', label: 'Serier', icon: '🍿' },
                { id: 'vod_channels', label: 'VOD-TV', icon: '🎞️' },
                { id: 'live', label: 'Live', icon: '📺' },
                { id: 'epg', label: 'Guide', icon: '📅' },
                { id: 'settings', label: 'Meny', icon: '⚙️' }
              ].map((t) => {
                const active = activeTab === t.id && !isFullscreenPlayer;
                return (
                  <button
                    key={t.id}
                    onClick={() => {
                      setActiveTab(t.id);
                      setExpandedCategory(null);
                      setIsFullscreenPlayer(false);
                    }}
                    className={`flex flex-col items-center justify-center py-1 px-1.5 ${
                      active ? 'text-[#F3D078] font-extrabold' : 'text-zinc-400'
                    }`}
                  >
                    <span className="text-sm leading-none">{t.icon}</span>
                    <span className="text-[8px] mt-1">{t.label}</span>
                  </button>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

    async function sendCrashReport(type, message, stack = '', extra = {}) {
      try {
        const enabled = localStorage.getItem('zp_crash_reports_enabled');
        if (enabled === 'false') return; // Respektera om användaren stängt av i inställningar

        const payload = {
          error_type: String(type || 'error'),
          error_message: String(message || 'Okänt fel').substring(0, 1000),
          error_stack: String(stack || '').substring(0, 3000),
          url: window.location.href,
          user_agent: navigator.userAgent,
          platform: navigator.platform || 'unknown',
          screen_size: `${window.innerWidth}x${window.innerHeight}`,
          app_version: '25.4.0',
          extra_info: JSON.stringify(extra),
          created_at: new Date().toISOString()

        // Spara senaste kraschen lokalt så man kan granska den i Inställningar
        try {
          const prev = JSON.parse(localStorage.getItem('zp_local_crash_log') || '[]');
          prev.unshift(payload);
          localStorage.setItem('zp_local_crash_log', JSON.stringify(prev.slice(0, 15)));
        } catch (e) {}

        // 1. Skicka till Supabase-tabellen "crash_reports"
        if (supabaseClient) {
          await supabaseClient.from('crash_reports').insert(payload);
        }

        // 2. Skicka till valfri Webhook om angiven

          fetch(CRASH_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(() => {});
        }
      } catch (err) {
        console.warn('Kunde ej skicka kraschrapport:', err);
      }

    // --- HJÄLPFUNKTIONER FÖR METADATA, KVALITET & PARSNING ---
    function extractMetadata(name, group, rawExtInf = '') {
      let quality = '';
      if (/\b(4k|uhd|2160p)\b/i.test(name) || /\b(4k|uhd)\b/i.test(group)) quality = '4K';
      else if (/\b(fhd|1080p)\b/i.test(name)) quality = 'FHD';
      else if (/\b(hd|720p)\b/i.test(name)) quality = 'HD';
      else if (/\b(sd)\b/i.test(name)) quality = 'SD';

      const yearMatch = name.match(/\b(19\d{2}|20[0-2]\d)\b/);
      const year = yearMatch ? yearMatch[1] : null;

      const seMatch = name.match(/^(.*?)\s*[-\s]*S(\d{1,2})\s*E(\d{1,3})/i);
      const seriesTitle = seMatch ? seMatch[1].replace(/[\(\[\-\_]+$/, '').trim() : null;
      const season = seMatch ? parseInt(seMatch[2], 10) : null;
      const episode = seMatch ? parseInt(seMatch[3], 10) : null;

      let addedTimestamp = 0;
      const addedAttr = rawExtInf.match(/(?:added|date|created|timestamp)="([^"]+)"/i);
      if (addedAttr && addedAttr[1]) {
        const parsedNum = Number(addedAttr[1]);
        if (!isNaN(parsedNum) && parsedNum > 100000) {
          addedTimestamp = parsedNum > 1e11 ? parsedNum : parsedNum * 1000;
        } else {
          const parsedDate = Date.parse(addedAttr[1]);
          if (!isNaN(parsedDate)) addedTimestamp = parsedDate;
        }
      }

      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const rating = (7.0 + (Math.abs(hash) % 23) / 10).toFixed(1).replace('.', ',');

      return { quality, year, seriesTitle, season, episode, rating, addedTimestamp };
    }

    function parseXmltvDate(dateStr) {
      if (!dateStr || dateStr.length < 14) return null;
      const y = parseInt(dateStr.substring(0, 4), 10);
      const m = parseInt(dateStr.substring(4, 6), 10) - 1;
      const d = parseInt(dateStr.substring(6, 8), 10);
      const h = parseInt(dateStr.substring(8, 10), 10);
      const min = parseInt(dateStr.substring(10, 12), 10);
      const s = parseInt(dateStr.substring(12, 14), 10);

      const tzMatch = dateStr.substring(14).trim().match(/^([+-])(\d{2})(\d{2})/);
      if (tzMatch) {
        const sign = tzMatch[1] === '+' ? 1 : -1;
        const tzHours = parseInt(tzMatch[2], 10);
        const tzMins = parseInt(tzMatch[3], 10);
        const offsetMs = sign * (tzHours * 60 + tzMins) * 60 * 1000;
        const utcMs = Date.UTC(y, m, d, h, min, s);
        return new Date(utcMs - offsetMs);
      }
      return new Date(y, m, d, h, min, s);
    }

    function formatTime(dateObj) {
      if (!dateObj) return '';
      const d = dateObj instanceof Date ? dateObj : new Date(dateObj);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    }

    // --- ROBUST XMLTV-PARSER (STÖDJER BÅDE DISPLAY-NAME OCH CHANNEL-ID) ---
    function parseXMLTV(xmlText) {
      if (!xmlText || typeof xmlText !== 'string') return {};
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const epgMap = {};

      // Mappa även kanal-elementens display-name -> channel id så fler kanaler matchar
      const channelEls = xmlDoc.getElementsByTagName('channel');
      const idAliases = {};
      for (let i = 0; i < channelEls.length; i++) {
        const chEl = channelEls[i];
        const idAttr = (chEl.getAttribute('id') || '').toLowerCase().trim();
        if (!idAttr) continue;
        const dispEls = chEl.getElementsByTagName('display-name');
        for (let j = 0; j < dispEls.length; j++) {
          const dispName = (dispEls[j].textContent || '').toLowerCase().trim();
          if (dispName) idAliases[dispName] = idAttr;
        }
      }

      const programmes = xmlDoc.getElementsByTagName('programme');
      const now = new Date();
      const minPast = new Date(now.getTime() - 2 * 60 * 60 * 1000);
      const maxFuture = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      for (let i = 0; i < programmes.length; i++) {
        const prog = programmes[i];
        const channelId = (prog.getAttribute('channel') || '').toLowerCase().trim();
        if (!channelId) continue;

        const stopDate = parseXmltvDate(prog.getAttribute('stop'));
        if (stopDate && stopDate < minPast) continue;

        const startDate = parseXmltvDate(prog.getAttribute('start'));
        if (startDate && startDate > maxFuture) continue;

        const titleEl = prog.getElementsByTagName('title')[0];
        const descEl = prog.getElementsByTagName('desc')[0];

        const title = titleEl ? titleEl.textContent : 'Okänt program';
        const desc = descEl ? descEl.textContent : '';

        if (!epgMap[channelId]) epgMap[channelId] = [];
        epgMap[channelId].push({ start: startDate, stop: stopDate, title, desc });
      }

      Object.keys(epgMap).forEach((chId) => {
        epgMap[chId].sort((a, b) => a.start - b.start);
      });

      // Kopiera över alias så kanaler som bara matchar på display-name också hittar sin EPG
      Object.entries(idAliases).forEach(([aliasName, targetId]) => {
        if (epgMap[targetId] && !epgMap[aliasName]) {
          epgMap[aliasName] = epgMap[targetId];
        }
      });

      return epgMap;
    }

    // --- SEPARERAD M3U-PARSER: SKILJER PÅ LIVE TV, VOD-KANALER, FILMER & SERIER ---
    function parseM3U(content) {
      const lines = content.split('\n');
      const live = [];
      const vodChannels = [];
      const movies = [];
      const series = [];
      let detectedEpgUrl = '';
      
      let currentName = '';
      let currentGroup = 'Övriga kanaler';
      let currentLogo = '';
      let currentTvgId = '';
      let currentTvgName = '';
      let currentRawExtInf = '';
      const seenIds = new Set();
      let orderCounter = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (i === 0 && line.startsWith('#EXTM3U')) {
          const urlTvgMatch = line.match(/(?:url-tvg|x-tvg-url)="([^"]+)"/i);
          if (urlTvgMatch && urlTvgMatch[1]) {
            detectedEpgUrl = urlTvgMatch[1].split(',')[0].trim();
          }
        }

        if (line.startsWith('#EXTINF:')) {
          currentRawExtInf = line;
          const commaIndex = line.lastIndexOf(',');
          currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Okänd kanal';
          
          const groupIdx = line.indexOf('group-title="');
          if (groupIdx !== -1) {
            const start = groupIdx + 13;
            const end = line.indexOf('"', start);
            if (end !== -1) currentGroup = line.substring(start, end);
          }

          const logoIdx = line.indexOf('tvg-logo="');
          if (logoIdx !== -1) {
            const start = logoIdx + 10;
            const end = line.indexOf('"', start);
            if (end !== -1) currentLogo = line.substring(start, end);
          }

          const idIdx = line.indexOf('tvg-id="');
          if (idIdx !== -1) {
            const start = idIdx + 8;
            const end = line.indexOf('"', start);
            if (end !== -1) currentTvgId = line.substring(start, end);
          }

          const nameIdx = line.indexOf('tvg-name="');
          if (nameIdx !== -1) {
            const start = nameIdx + 10;
            const end = line.indexOf('"', start);
            if (end !== -1) currentTvgName = line.substring(start, end);
          }
        } else if (line[0] !== '#') {
          orderCounter += 1;
          const lowerGroup = currentGroup.toLowerCase();
          const lowerUrl = line.toLowerCase();
          const lowerName = currentName.toLowerCase();

          let baseId = 'id_' + (currentGroup + '_' + currentName).toLowerCase().replace(/[^a-z0-9]/g, '');
          let uniqueId = baseId;
          let counter = 1;
          while (seenIds.has(uniqueId)) {
            uniqueId = `${baseId}_${counter++}`;
          }
          seenIds.add(uniqueId);

          const meta = extractMetadata(currentName, currentGroup, currentRawExtInf);

          const hasVideoFileExtension = /\.(mp4|mkv|avi|mov|webm|m4v|flv)(\?.*)?$/i.test(lowerUrl);
          const isSeriesUrlOrPattern =
            lowerUrl.includes('/series/') ||
            /s\d{1,2}\s*e\d{1,3}/i.test(lowerName) ||
            ((lowerGroup.includes('serie') || lowerGroup.includes('series')) && hasVideoFileExtension);

          const isMovieFileOrUrl =
            !isSeriesUrlOrPattern &&
            (lowerUrl.includes('/movie/') ||
              lowerUrl.includes('/movies/') ||
              (hasVideoFileExtension && !lowerUrl.endsWith('.ts') && !lowerUrl.includes('.m3u8')));

          const isVodChannelPattern =
            !isSeriesUrlOrPattern &&
            !isMovieFileOrUrl &&
            (lowerGroup.includes('24/7') ||
              lowerGroup.includes('24-7') ||
              lowerGroup.includes('vod') ||
              lowerGroup.includes('box office') ||
              lowerGroup.includes('ppv') ||
              lowerGroup.includes('cinema') ||
              lowerGroup.includes('filmkanal') ||
              lowerGroup.includes('movie channel') ||
              lowerName.includes('24/7') ||
              lowerName.includes('vod:'));

          let itemType = 'live';
          if (isSeriesUrlOrPattern) itemType = 'series';
          else if (isMovieFileOrUrl) itemType = 'movies';
          else if (isVodChannelPattern) itemType = 'vod_channel';

          const addedScore = meta.addedTimestamp > 0 ? meta.addedTimestamp : orderCounter;

          const item = {
            id: uniqueId,
            tvgId: (currentTvgId || currentTvgName || currentName).toLowerCase(),
            name: currentName,
            group: currentGroup || 'Övriga kanaler',
            logo: currentLogo,
            url: line,
            type: itemType,
            quality: meta.quality,
            year: meta.year,
            rating: meta.rating,
            seriesTitle: meta.seriesTitle,
            season: meta.season,
            episode: meta.episode,
            addedOrder: addedScore
          };

          if (itemType === 'series') series.push(item);
          else if (itemType === 'movies') movies.push(item);
          else if (itemType === 'vod_channel') vodChannels.push(item);
          else live.push(item);

          currentName = '';
          currentGroup = 'Övriga kanaler';
          currentLogo = '';
          currentTvgId = '';
          currentTvgName = '';
          currentRawExtInf = '';
        }
      }
      return { live, vodChannels, movies, series, detectedEpgUrl };
    }

            loadUserData(data.user.id);
          } else {
            setAuthModal(true);
          }
        }).catch(() => {});

        const { data: authListener } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session?.user) {
            setUser(session.user);
            setAuthModal(false);
            loadUserData(session.user.id);
          } else {
            setUser(null);
            setChannels(INITIAL_CHANNELS);

      // ============================================================================
      // PUNKT 6: LADDNING AV LOKAL CACHE VS MOLNSYNKADE LÄNKAR (DATOR VS TELEFON)
      // ============================================================================
      async function loadUserData(userId) {
        let hasLocalMedia = false;

        // 1. Försök ladda den tunga mediedatan från enhetens egna IndexedDB
        const cachedMedia = await loadLocalCache(`media_${userId}`);
        if (cachedMedia && (cachedMedia.channels?.length > 2 || cachedMedia.movies?.length > 0 || cachedMedia.series?.length > 0)) {
          hasLocalMedia = true;
          if (cachedMedia.channels?.length) setChannels(cachedMedia.channels);
          if (cachedMedia.vodChannels) setVodChannels(cachedMedia.vodChannels);
          if (cachedMedia.movies) setMovies(cachedMedia.movies);
          if (cachedMedia.series) setSeries(cachedMedia.series);
          if (cachedMedia.m3uUrl) {
            setSavedM3uUrl(cachedMedia.m3uUrl);
            setM3uUrl(cachedMedia.m3uUrl);
          }
          if (cachedMedia.epgUrl) setEpgUrl(cachedMedia.epgUrl);
          setStatusMsg(
            `Spellista redo på denna enhet: ${cachedMedia.channels?.length || 0} livekanaler, ${cachedMedia.vodChannels?.length || 0} VOD-kanaler, ${cachedMedia.movies?.length || 0} filmer, ${cachedMedia.series?.length || 0} serieavsnitt.`
          );
        }

        const cachedEpg = await loadLocalCache(`epg_${userId}`);
        if (cachedEpg && Object.keys(cachedEpg).length > 0) {
          setEpgData(cachedEpg);
        }

        const cachedHistory = await loadLocalCache(`history_${userId}`);
        if (cachedHistory) {
          if (cachedHistory.watchHistory) setWatchHistory(cachedHistory.watchHistory);
          if (cachedHistory.watchProgress) setWatchProgress(cachedHistory.watchProgress);
        }

        // 2. Hämta användarens inställningar, favoritmappar och sparade M3U/EPG-länkar från Supabase
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from('user_settings')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

          if (!error && data) {
            if (Array.isArray(data.fav_lists) && data.fav_lists.length > 0) {
              setFavLists(data.fav_lists);
            } else if (data.fav_lists && typeof data.fav_lists === 'object') {
              // Stöd för inbäddad metadata i fav_lists om kolumner saknas i Supabase
              if (Array.isArray(data.fav_lists.lists)) setFavLists(data.fav_lists.lists);
              if (data.fav_lists.m3uUrl && !m3uUrl) {
                setM3uUrl(data.fav_lists.m3uUrl);
                setSavedM3uUrl(data.fav_lists.m3uUrl);
              }
              if (data.fav_lists.epgUrl && !epgUrl) {
                setEpgUrl(data.fav_lists.epgUrl);
              }
            }

            if (data.m3u_url) {
              setM3uUrl(data.m3u_url);
              setSavedM3uUrl(data.m3u_url);

      async function saveToCloud(lists, customM3u = m3uUrl, customEpg = epgUrl) {
        if (!supabaseClient || !user) return;
        try {
          // Försök spara både fav_lists och textlänkarna m3u_url / epg_url
          const { error } = await supabaseClient.from('user_settings').upsert({
            user_id: user.id,
            fav_lists: lists,
            m3u_url: customM3u || savedM3uUrl || '',
            epg_url: customEpg || epgUrl || '',
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

          // Fallback om m3u_url/epg_url-kolumnerna inte finns i Supabase-tabellen ännu
          if (error) {
            await supabaseClient.from('user_settings').upsert({
              user_id: user.id,
              fav_lists: lists,
              updated_at: new Date().toISOString()

          console.error('Kunde ej synka till molnet:', err);

      // Kontrollera betalvägg innan uppspelning om appEdition === 'premium' och !isSubscriber
      const startPlayback = (item, openFull = true) => {

        setWatchHistory((prev) => {

          const updated = [item, ...filtered].slice(0, 25);

            saveLocalCache(`history_${user.id}`, { watchHistory: updated, watchProgress });
          }

      };

      const handleTimeUpdate = () => {
        const video = videoRef.current;
        if (!video || !currentMedia || currentMedia.type === 'live' || currentMedia.type === 'vod_channel') return;
        if (video.currentTime > 5 && video.duration > 30) {
          setWatchProgress((prev) => {
            const next = {
              ...prev,
              [currentMedia.id]: {
                time: Math.floor(video.currentTime),
                duration: Math.floor(video.duration),
                updated: Date.now()
              }
            };
            if (user && Math.floor(video.currentTime) % 10 === 0) {
              saveLocalCache(`history_${user.id}`, { watchHistory, watchProgress: next });

            return next;

    // --- SMART SJÄLVUPPLÅSANDE VIDEOSPELARMOTOR (DIREKT I FÖNSTRET) ---
      useEffect(() => {
        const video = videoRef.current;

        if (!video || !rawMediaUrl || !user) return;

        let mpegtsPlayer = null;
        let isCancelled = false;

        const cleanUp = () => {
          if (hls) {
            try { hls.destroy(); } catch (e) {}
            hls = null;
          }
          if (mpegtsPlayer) {
            try {
              mpegtsPlayer.pause();
              mpegtsPlayer.unload();
              mpegtsPlayer.detachMediaElement();
              mpegtsPlayer.destroy();
            } catch (e) {}
            mpegtsPlayer = null;
          }
          video.removeAttribute('src');
          video.load();
        };

        cleanUp();

        const applySavedTime = () => {
          const saved = watchProgress[currentMedia.id];
          if (saved && saved.time > 10 && currentMedia.type !== 'live' && currentMedia.type !== 'vod_channel') {
            video.currentTime = saved.time;
          }
        };

        const buildCandidateQueue = (url, engineMode) => {
          const queue = [];
          const lower = url.toLowerCase();
          const isDirectVodFile = /\.(mp4|mkv|avi|mov|webm)(\?.*)?$/i.test(lower);
          const isM3u8 = lower.includes('.m3u8');

          let m3u8Variant = null;
          const xtreamLiveMatch = url.match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)(?:\.ts|\.m3u8)?$/i);
          if (xtreamLiveMatch) {
            const [, origin, u, p, streamId] = xtreamLiveMatch;
            m3u8Variant = `${origin}/live/${u}/${p}/${streamId}.m3u8`;
          } else if (lower.endsWith('.ts')) {
            m3u8Variant = url.replace(/\.ts$/i, '.m3u8');
          }

          const wrapCors = (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`;

          if (engineMode === 'native' || isDirectVodFile) {
            queue.push({ type: 'native', url });
            queue.push({ type: 'native', url: wrapCors(url) });
            return queue;
          }

          if (engineMode === 'hls') {
            if (m3u8Variant) queue.push({ type: 'hls', url: m3u8Variant });
            queue.push({ type: 'hls', url });
            if (m3u8Variant) queue.push({ type: 'hls', url: wrapCors(m3u8Variant) });
            queue.push({ type: 'hls', url: wrapCors(url) });
            return queue;
          }

          if (engineMode === 'mpegts') {
            queue.push({ type: 'mpegts', url });
            queue.push({ type: 'mpegts', url: wrapCors(url) });
            return queue;
          }

          if (isM3u8) {
            queue.push({ type: 'hls', url });
            queue.push({ type: 'hls', url: wrapCors(url) });
            queue.push({ type: 'native', url });
          } else {
            if (m3u8Variant) queue.push({ type: 'hls', url: m3u8Variant });
            queue.push({ type: 'mpegts', url });
            if (m3u8Variant) queue.push({ type: 'hls', url: wrapCors(m3u8Variant) });
            queue.push({ type: 'mpegts', url: wrapCors(url) });
            if (m3u8Variant) queue.push({ type: 'native', url: m3u8Variant });
            queue.push({ type: 'native', url });
          }

          return queue;
        };

        const candidates = buildCandidateQueue(rawMediaUrl, playerEngine);
        let currentIdx = 0;

        const tryNextCandidate = () => {
          if (isCancelled) return;
          cleanUp();

          if (currentIdx >= candidates.length) {
            setVideoError(
              'För att spela okrypterade HTTP-kanaler direkt i fönstret: Klicka på ikonen till vänster om zappaportalen.se i adressfältet -> Webbplatsinställningar -> ändra "Osäkert innehåll" (Insecure content) till "Tillåt". Då spelas alla kanaler direkt här i rutan!'
            );
            return;
          }

          const candidate = candidates[currentIdx++];
          const targetUrl = candidate.url;

          if (candidate.type === 'hls') {
            if (window.Hls && window.Hls.isSupported()) {
              hls = new window.Hls({
                enableWorker: true,
                lowLatencyMode: true,
                manifestLoadingTimeOut: 7000,
                manifestLoadingMaxRetry: 1,
                levelLoadingTimeOut: 7000
              });
              hls.loadSource(targetUrl);
              hls.attachMedia(video);

              hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                if (isCancelled) return;
                applySavedTime();
                video.play().catch(() => {});
              });

              hls.on(window.Hls.Events.ERROR, (event, data) => {
                if (data.fatal && !isCancelled) {
                  tryNextCandidate();
                }
              });
            } else {
              tryNextCandidate();
            }
          } else if (candidate.type === 'mpegts') {
            if (window.mpegts && window.mpegts.isSupported()) {
              try {
                mpegtsPlayer = window.mpegts.createPlayer(
                  {
                    type: 'mpegts',
                    isLive: currentMedia.type === 'live' || currentMedia.type === 'vod_channel',
                    url: targetUrl,
                    cors: true
                  },
                  {
                    enableWorker: true,
                    lazyLoadMaxDuration: 3 * 60,
                    seekType: 'range',
                    liveBufferLatencyChasing: true
                  }
                );
                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();
                mpegtsPlayer.play().catch(() => {});

                let hasStartedPlaying = false;
                const onPlaying = () => { hasStartedPlaying = true; };
                video.addEventListener('playing', onPlaying, { once: true });

                const timeoutId = setTimeout(() => {
                  if (!hasStartedPlaying && !isCancelled) {
                    tryNextCandidate();
                  }
                }, 6000);

                mpegtsPlayer.on(window.mpegts.Events.ERROR, () => {
                  clearTimeout(timeoutId);
                  if (!isCancelled) tryNextCandidate();
                });
              } catch (err) {
                tryNextCandidate();
              }
            } else {
              tryNextCandidate();
            }
          } else {
            video.src = targetUrl;
            video.addEventListener('loadedmetadata', applySavedTime, { once: true });
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                if (!isCancelled) tryNextCandidate();
              });
            }
            video.onerror = () => {
              if (!isCancelled) tryNextCandidate();
            };
          }
        };

        tryNextCandidate();

        return () => {
          isCancelled = true;
          cleanUp();
        };
      }, [currentMedia, user, playerEngine]);
      const getChannelEpg = (ch) => {
        if (!ch || Object.keys(epgData).length === 0) return null;
        const cleanName = ch.name.toLowerCase().replace(/\s+(hd|fhd|uhd|4k|se|uk|us|\[\-?\d+h\])$/gi, '').trim();
        const progList = epgData[ch.tvgId] || epgData[ch.name.toLowerCase()] || epgData[cleanName];
        if (!progList || progList.length === 0) return null;

        const now = new Date();
        let currentProg = null;
        let nextProg = null;

        for (let i = 0; i < progList.length; i++) {
          const p = progList[i];
          const start = p.start instanceof Date ? p.start : new Date(p.start);
          const stop = p.stop instanceof Date ? p.stop : new Date(p.stop);
          if (start <= now && stop >= now) {
            currentProg = { ...p, start, stop };
            nextProg = progList[i + 1] ? { ...progList[i + 1], start: new Date(progList[i + 1].start), stop: new Date(progList[i + 1].stop) } : null;
            break;
          } else if (start > now) {
            nextProg = { ...p, start, stop };
            break;
          }
        }

        let progress = 0;
        if (currentProg && currentProg.start && currentProg.stop) {
          const total = currentProg.stop - currentProg.start;
          const elapsed = now - currentProg.start;
          if (total > 0) progress = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        }

        return { currentProg, nextProg, progress };
      };

      // --- GRUPPERING AV SERIER + SENASTE UPPLADDADE AVSNITT ---
      const groupedSeriesCatalog = useMemo(() => {
        const showMap = {};
        const shows = [];
        series.forEach((ep) => {
          const showKey = (ep.seriesTitle || ep.name).toLowerCase().trim();
          if (!showMap[showKey]) {
            const showObj = {
              ...ep,
              id: 'show_' + showKey.replace(/[^a-z0-9]/g, ''),
              name: ep.seriesTitle || ep.name,
              isSeriesShow: true,
              episodes: [],
              episodeCount: 0,
              latestAddedOrder: ep.addedOrder || 0
            };
            showMap[showKey] = showObj;
            shows.push(showObj);
          }
          showMap[showKey].episodes.push(ep);
          showMap[showKey].episodeCount += 1;
          if ((ep.addedOrder || 0) > showMap[showKey].latestAddedOrder) {
            showMap[showKey].latestAddedOrder = ep.addedOrder;
          }
        });
        return shows;
      }, [series]);

      const recentlyAddedMovies = useMemo(() => {
        return [...movies].sort((a, b) => (b.addedOrder || 0) - (a.addedOrder || 0));
      }, [movies]);

        [...channels, ...vodChannels, ...movies, ...series].forEach((item) => {
          if (item.group) set.add(item.group);
        });
        return Array.from(set);
      }, [channels, vodChannels, movies, series]);

      // Inkludera även groupedSeriesCatalog så att en sparad serie (`show_...`) hittas direkt i favoritmappar!
      const favItemsById = useMemo(() => {
        const allItems = [...channels, ...vodChannels, ...movies, ...groupedSeriesCatalog, ...series];
        const map = {};
        favLists.forEach((favList) => {
          const manualSet = new Set(favList.channelIds || []);
          const hasFilter = (favList.filter && favList.filter.trim() !== '') || (favList.filterGroup && favList.filterGroup !== 'ALL');
          const fg = (favList.filterGroup || '').toLowerCase();
          const term = (favList.filter || '').toLowerCase().trim();

          const seenInFolder = new Set();
          map[favList.id] = allItems.filter((item) => {
            if (seenInFolder.has(item.id)) return false;
            if (manualSet.has(item.id)) {
              seenInFolder.add(item.id);
              return true;
            }
            if (!hasFilter) return false;
            // För auto-regler, undvik att lägga in alla enskilda serieavsnitt om serie-kortet redan finns
            if (item.type === 'series' && !item.isSeriesShow) return false;

            const itemGrp = (item.group || '').toLowerCase();
            const groupMatches = !fg || fg === 'all' || itemGrp === fg || itemGrp.includes(fg);
            const termMatches = !term || item.name.toLowerCase().includes(term);

            if (groupMatches && termMatches) {
              seenInFolder.add(item.id);
              return true;
            }
            return false;
          });
        });

      const openInExternalPlayer = (scheme, item = currentMedia) => {

        }

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        let targetUri = '';

        if (scheme === 'vlc') {
          if (isIOS) {
            targetUri = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}`;
          } else if (isAndroid) {
            const noProto = rawUrl.replace(/^https?:\/\//i, '');
            const proto = rawUrl.startsWith('https') ? 'https' : 'http';
            targetUri = `intent://${noProto}#Intent;scheme=${proto};package=org.videolan.vlc;type=video/*;end`;

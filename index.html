                          key={fl.id}
                          onClick={() => { setSelectedLiveGroup('FAV:' + fl.id); setRenderLimit(80); }}
                          style={selectedLiveGroup === 'FAV:' + fl.id ? { backgroundColor: accentColor } : {}}
                          className={`px-4 py-2 rounded-full text-xs font-extrabold shrink-0 transition flex items-center gap-1.5 ${
                            selectedLiveGroup === 'FAV:' + fl.id
                              ? 'text-white'
                              : 'bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:bg-amber-500/20'
                          }`}
                        >
                          <span>★ {fl.name}</span>
                          <span className="opacity-75">({(favItemsById[fl.id] || []).length})</span>
                        </button>
                      ))}

                      {Object.keys(liveGroups).map((grp) => (
                        <button
                          key={grp}
                          onClick={() => { setSelectedLiveGroup(grp); setRenderLimit(80); }}
                          style={selectedLiveGroup === grp ? { backgroundColor: accentColor } : {}}
                          className={`px-4 py-2 rounded-full text-xs font-bold shrink-0 transition ${
                            selectedLiveGroup === grp ? 'text-white' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-white/10'
                          }`}
                        >
                          {grp} ({liveGroups[grp].length})
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Kanalkort i IPTVX-stil */}
                  {(() => {
                    const list =
                      selectedLiveGroup === 'ALL'
                        ? channels
                        : selectedLiveGroup.startsWith('FAV:')
                        ? favItemsById[selectedLiveGroup.replace('FAV:', '')] || []
                        : liveGroups[selectedLiveGroup] || [];

                    return (
                      <>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">
                          {list.slice(0, renderLimit).map((ch) => {
                            const epg = getChannelEpg(ch);
                            const isPlaying = currentMedia?.id === ch.id;
                            return (
                              <div
                                key={ch.id}
                                onClick={() => startPlayback(ch, true)}
                                className={`rounded-2xl bg-[#111215] border p-4 flex flex-col justify-between cursor-pointer transition hover:scale-[1.01] ${
                                  isPlaying ? 'border-[#E50914] shadow-[0_0_20px_rgba(229,9,20,0.25)]' : 'border-white/10 hover:border-white/30'
                                }`}
                              >
                                <div className="flex items-center justify-between gap-3">
                                  <div className="flex items-center gap-3 min-w-0 flex-1">
                                    <div className="w-12 h-12 rounded-xl bg-black border border-white/10 flex items-center justify-center p-1.5 shrink-0">
                                      {ch.logo ? (
                                        <img src={ch.logo} alt="" loading="lazy" className="max-w-full max-h-full object-contain" />
                                      ) : (
                                        <span className="text-xs font-black text-[#E50914]">LIVE</span>
                                      )}
                                    </div>
                                    <div className="min-w-0 flex-1">
                                      <h3 className="text-xs sm:text-sm font-bold text-white truncate">{ch.name}</h3>
                                      <div className="flex items-center gap-1.5 mt-1">
                                        {ch.quality && (
                                          <span className="text-[9px] font-bold px-1.5 py-0.2 rounded border border-white/20 text-zinc-300">
                                            {ch.quality}
                                          </span>
                                        )}
                                        <span className="text-[10px] text-zinc-400 truncate">{ch.group}</span>
                                      </div>
                                    </div>
                                  </div>

                                  <button
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      setFavModalItem(ch);
                                    }}
                                    className={`w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${
                                      allFavoritedIds.has(ch.id) ? 'bg-[#E50914] text-white' : 'bg-white/5 text-zinc-400 hover:text-white'
                                    }`}
                                  >
                                    ★
                                  </button>
                                </div>

                                <div className="mt-3 pt-2.5 border-t border-white/5 space-y-1">
                                  {epg?.currentProg ? (
                                    <>
                                      <div className="flex justify-between text-[10px] text-zinc-400">
                                        <span>{formatTime(epg.currentProg.start)} - {formatTime(epg.currentProg.stop)}</span>
                                        <span>{epg.progress}%</span>
                                      </div>
                                      <p className="text-xs font-bold text-white truncate">{epg.currentProg.title}</p>
                                      <div className="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                                        <div style={{ width: `${epg.progress}%`, backgroundColor: accentColor }} className="h-full rounded-full" />
                                      </div>
                                    </>
                                  ) : (
                                    <p className="text-[11px] text-zinc-500">EPG inte tillgänglig</p>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {list.length > renderLimit && (
                          <button
                            onClick={() => setRenderLimit((prev) => prev + 100)}
                            className="w-full py-3.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-white/10 text-xs font-extrabold text-white transition"
                          >
                            Visa fler kanaler ({list.length - renderLimit} kvar)...
                          </button>
                        )}
                      </>
                    );
                  })()}
                </div>
              )}

              {/* 3. FLIK: TV-GUIDE (EXAKT SOM IPTVX MED TOPP-PREVIEW + TIDSLINJE-TABELL) */}
              {!isFullscreenPlayer && activeTab === 'epg' && (
                <div className="max-w-5xl mx-auto px-4 sm:px-8 py-4 space-y-5">
                  
                  {/* Topp-preview ruta (som i IMG_2601) */}
                  <div className="rounded-2xl bg-[#0B0C0E] border border-white/15 overflow-hidden shadow-2xl">
                    <div className="relative aspect-video max-h-[260px] w-full bg-black flex items-center justify-center">
                      <span className="absolute top-3 left-3 z-20 bg-[#E50914] text-white text-[10px] font-black uppercase px-2.5 py-1 rounded-md flex items-center gap-1.5 shadow">
                        <span className="w-2 h-2 rounded-full bg-white live-dot" />
                        LIVE
                      </span>
                      {currentMedia ? (
                        <div className="text-center space-y-2 p-4">
                          <p className="text-sm sm:text-base font-extrabold text-white">{currentMedia.name}</p>
                          <button
                            onClick={() => setIsFullscreenPlayer(true)}
                            className="bg-white text-black font-extrabold px-5 py-2 rounded-full text-xs shadow"
                          >
                            ▶ Öppna i fullskärm
                          </button>
                        </div>
                      ) : (
                        <p className="text-sm text-zinc-400">Välj en kanal nedan för att starta sändningen</p>
                      )}
                    </div>

                    <div className="p-4 sm:p-5 border-t border-white/10 space-y-2">
                      <h2 className="text-base sm:text-lg font-extrabold text-white truncate">
                        {currentMedia ? currentMedia.name : 'Ingen kanal vald'}
                      </h2>
                      <p className="text-xs sm:text-sm font-bold text-zinc-300">
                        {activeChannelEpg?.currentProg ? activeChannelEpg.currentProg.title : 'EPG inte tillgänglig'}
                      </p>
                      <p className="text-xs text-zinc-500 line-clamp-2">
                        {activeChannelEpg?.currentProg?.desc || 'TV-guiden innehåller ingen information om programmet som visas just nu.'}
                      </p>
                      <div className="pt-2 flex items-center justify-between text-xs text-zinc-400">
                        <span>
                          {activeChannelEpg?.currentProg
                            ? `${formatTime(activeChannelEpg.currentProg.start)} - ${formatTime(activeChannelEpg.currentProg.stop)}`
                            : '20:00 - 21:00 (60 min)'}
                        </span>
                      </div>
                      <div className="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                        <div
                          style={{ width: `${activeChannelEpg?.progress || 45}%`, backgroundColor: accentColor }}
                          className="h-full rounded-full"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Sök & IDAG-indikator */}
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-3">
                    <div className="flex items-center gap-6">
                      <span style={{ color: accentColor }} className="text-xs sm:text-sm font-black uppercase tracking-wider border-b-2 border-[#E50914] pb-1">
                        IDAG
                      </span>
                      <span className="text-xs sm:text-sm font-bold text-zinc-400">
                        {new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })}
                      </span>
                    </div>
                    <input
                      type="text"
                      placeholder="Sök kanal i TV-guiden..."
                      value={epgSearch}
                      onChange={(e) => setEpgSearch(e.target.value)}
                      className="w-full sm:w-64 bg-zinc-900 border border-white/15 focus:border-[#E50914] rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                    />
                  </div>

                  {/* IPTVX Tvåkolumns EPG-lista */}
                  <div className="space-y-2.5">
                    {channels
                      .filter((ch) => !epgSearch || ch.name.toLowerCase().includes(epgSearch.toLowerCase()))
                      .slice(0, 60)
                      .map((ch) => {
                        const info = getChannelEpg(ch);
                        return (
                          <div
                            key={ch.id}
                            onClick={() => startPlayback(ch, true)}
                            className="grid grid-cols-12 rounded-xl overflow-hidden bg-[#121316] border border-white/10 hover:border-[#E50914] cursor-pointer transition"
                          >
                            {/* Vänster kolumn: Kanalinfo */}
                            <div className="col-span-5 sm:col-span-4 p-3.5 bg-[#16181C] flex items-center gap-3 border-r border-white/10">
                              <div className="w-10 h-10 rounded-lg bg-black border border-white/10 flex items-center justify-center p-1 shrink-0">
                                {ch.logo ? (
                                  <img src={ch.logo} alt="" loading="lazy" className="max-w-full max-h-full object-contain" />
                                ) : (
                                  <span className="text-[10px] font-black text-[#E50914]">TV</span>
                                )}
                              </div>
                              <div className="min-w-0 flex-1">
                                <h4 className="text-xs sm:text-sm font-extrabold text-white truncate">{ch.name}</h4>
                                <div className="flex items-center gap-1.5 mt-1">
                                  {ch.quality && (
                                    <span className="text-[9px] font-bold px-1.5 py-0.2 rounded border border-white/25 text-zinc-300">
                                      {ch.quality}
                                    </span>
                                  )}
                                  <span className="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-[#E50914]/20 text-red-300">
                                    LIVE
                                  </span>
                                </div>
                              </div>
                            </div>

                            {/* Höger kolumn: Rödtonad programtablå */}
                            <div className="col-span-7 sm:col-span-8 p-3.5 bg-gradient-to-r from-[#451010]/70 via-[#290909]/60 to-[#180707]/60 flex flex-col justify-center">
                              {info?.currentProg ? (
                                <>
                                  <span className="text-[10px] font-bold text-red-200/80">
                                    {formatTime(info.currentProg.start)} - {formatTime(info.currentProg.stop)}
                                  </span>
                                  <p className="text-xs sm:text-sm font-extrabold text-white truncate mt-0.5">
                                    {info.currentProg.title}
                                  </p>
                                  {info.nextProg && (
                                    <p className="text-[11px] text-zinc-400 truncate mt-1">
                                      Nästa ({formatTime(info.nextProg.start)}): {info.nextProg.title}
                                    </p>
                                  )}
                                </>
                              ) : (
                                <>
                                  <span className="text-[10px] text-zinc-400">
                                    {new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })}
                                  </span>
                                  <p className="text-xs sm:text-sm font-bold text-zinc-200 mt-0.5">EPG inte tillgänglig</p>
                                </>
                              )}
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>
              )}

              {/* 4. FLIK: INSTÄLLNINGAR (EXAKT SOM IMG_2603 & IMG_2604 MED "PRENUMERANT"-BADGE) */}
              {!isFullscreenPlayer && activeTab === 'settings' && (
                <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 space-y-6">
                  
                  {/* Gul/Guld PRENUMERANT-badge högst upp */}
                  <div className="flex flex-col items-center justify-center space-y-2 pt-2">
                    <span className="bg-[#F59E0B] text-black font-black text-xs sm:text-sm tracking-wider uppercase px-5 py-1.5 rounded-full shadow-[0_0_25px_rgba(245,158,11,0.4)]">
                      PRENUMERANT • ROYAL EDITION
                    </span>
                    <span className="text-xs text-zinc-400">{user.email}</span>
                  </div>

                  {/* Undervyer i Inställningar */}
                  {settingsSubView === 'sources' ? (
                    <div className="bg-[#111215] border border-white/10 rounded-2xl p-6 space-y-6">
                      <div className="flex items-center justify-between border-b border-white/10 pb-3">
                        <h2 className="text-base font-extrabold text-white">📂 Spellista Hantering & EPG</h2>
                        <button onClick={() => setSettingsSubView(null)} className="text-xs font-bold text-[#E50914]">
                          ← Tillbaka
                        </button>
                      </div>

                      <div className="space-y-4">
                        <div className="p-4 rounded-xl bg-black/60 border border-white/10 space-y-2">
                          <label className="text-xs font-extrabold text-white block">1. Ladda upp M3U-fil (Snabbast & utan CORS)</label>
                          <input
                            type="file"
                            accept=".m3u,.m3u8,.txt"
                            onChange={handleFileUpload}
                            className="block w-full text-xs text-zinc-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-[#E50914] file:text-white file:font-bold cursor-pointer"
                          />
                        </div>

                        <form onSubmit={handleLoadM3uUrl} className="p-4 rounded-xl bg-black/60 border border-white/10 space-y-3">
                          <label className="text-xs font-extrabold text-white block">2. Ladda M3U via URL-länk</label>
                          <input
                            type="url"
                            placeholder="https://..."
                            value={m3uUrl || savedM3uUrl}
                            onChange={(e) => setM3uUrl(e.target.value)}
                            className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                          />
                          <button type="submit" style={{ backgroundColor: accentColor }} className="w-full py-2.5 rounded-xl text-xs font-extrabold text-white">
                            Hämta & Cachelagra Spellista
                          </button>
                        </form>

                        <div className="p-4 rounded-xl bg-black/60 border border-white/10 space-y-2">
                          <label className="text-xs font-extrabold text-white block">3. Ladda upp EPG (.xml) eller ange URL</label>
                          <input
                            type="file"
                            accept=".xml"
                            onChange={handleEpgFileUpload}
                            className="block w-full text-xs text-zinc-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-zinc-800 file:text-white file:font-bold cursor-pointer mb-2"
                          />
                          <div className="flex gap-2">
                            <input
                              type="url"
                              placeholder="http://... (XMLTV EPG URL)"
                              value={epgUrl}
                              onChange={(e) => setEpgUrl(e.target.value)}
                              className="flex-1 bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                            />
                            <button
                              type="button"
                              onClick={() => loadEpgFromUrl(epgUrl)}
                              className="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-xs font-bold"
                            >
                              Ladda EPG
                            </button>
                          </div>
                        </div>

                        {(statusMsg || epgStatus) && (
                          <div className="p-3.5 rounded-xl bg-emerald-950/60 border border-emerald-500/40 text-xs font-bold text-emerald-300 text-center">
                            {statusMsg || epgStatus}
                          </div>
                        )}
                      </div>
                    </div>
                  ) : settingsSubView === 'appearance' ? (
                    <div className="bg-[#111215] border border-white/10 rounded-2xl p-6 space-y-5">
                      <div className="flex items-center justify-between border-b border-white/10 pb-3">
                        <h2 className="text-base font-extrabold text-white">🎨 Tillägg: teman och utseende</h2>
                        <button onClick={() => setSettingsSubView(null)} className="text-xs font-bold text-[#E50914]">
                          ← Tillbaka
                        </button>
                      </div>

                      <div className="space-y-4">
                        <div className="flex items-center justify-between p-4 rounded-xl bg-black/50 border border-white/10">
                          <div>
                            <p className="text-sm font-bold text-white">Färgtema</p>
                            <p className="text-xs text-zinc-400">Välj mellan IPTVX Crimson Red eller MagnersKing Royal Gold</p>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={() => setAccentTheme('crimson')}
                              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${
                                accentTheme === 'crimson' ? 'bg-[#E50914] text-white border-white' : 'bg-zinc-900 text-zinc-400 border-white/10'
                              }`}
                            >
                              🔴 IPTVX Röd
                            </button>
                            <button
                              onClick={() => setAccentTheme('gold')}
                              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${
                                accentTheme === 'gold' ? 'bg-[#D4A346] text-black border-white' : 'bg-zinc-900 text-zinc-400 border-white/10'
                              }`}
                            >
                              👑 Royal Guld
                            </button>
                          </div>
                        </div>

                        <div className="flex items-center justify-between p-4 rounded-xl bg-black/50 border border-white/10">
                          <div>
                            <p className="text-sm font-bold text-white">Smart-TV / Storskärmsläge</p>
                            <p className="text-xs text-zinc-400">Förstorar text och knappar för visning på TV</p>
                          </div>
                          <button
                            onClick={() => setTvMode(!tvMode)}
                            className={`px-4 py-2 rounded-xl text-xs font-extrabold ${
                              tvMode ? 'bg-emerald-600 text-white' : 'bg-zinc-800 text-zinc-300'
                            }`}
                          >
                            {tvMode ? 'PÅ' : 'AV'}
                          </button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    /* IPTVX Menylista med röda ikoner till vänster och › till höger */
                    <div className="bg-[#0B0C0E] border border-white/10 rounded-2xl divide-y divide-white/10 overflow-hidden shadow-2xl">
                      {[
                        { icon: '👑', label: 'In-App-köp & Kvittot (Royal Active)', action: () => alert('MAGNERSKING Royal Cinema Edition är aktiverad på ditt konto.') },
                        { icon: '🎨', label: 'Tillägg: teman och utseende', action: () => setSettingsSubView('appearance') },
                        { icon: '☁️', label: 'Moln-synkronisering (Supabase Cloud)', action: () => { saveToCloud(favLists); alert('Dina Smarta Mappar är synkroniserade med molnet!'); } },
                        { icon: '✨', label: 'AI & Smarta Favoritmappar', action: () => setManageFavModal(true) },
                        { icon: '📋', label: 'Spellista Hantering (M3U & EPG)', action: () => setSettingsSubView('sources') },
                        { icon: '▶', label: `Spelare (${playerEngine.toUpperCase()})`, action: () => {
                          const order = ['auto', 'mpegts', 'hls', 'native'];
                          const next = order[(order.indexOf(playerEngine) + 1) % order.length];
                          setPlayerEngine(next);
                        }},
                        { icon: '📡', label: 'Live & TV-guide', action: () => setActiveTab('epg') },
                        { icon: '📝', label: 'Metadata & Rensa Lokal Cache', action: handleClearCache },
                        { icon: '🖥️', label: 'MAGNERSKING Media Server & VLC Bridge', action: () => alert('VLC och PotPlayer-bryggan är redo. Klicka på "Spela i VLC" under valfri kanal för direktuppspelning.') },
                        { icon: '⚙️', label: `Generali (TV-läge: ${tvMode ? 'PÅ' : 'AV'})`, action: () => setTvMode(!tvMode) },
                        { icon: '🚪', label: 'Logga ut från konto', action: handleLogout }
                      ].map((row, i) => (
                        <button
                          key={i}
                          onClick={row.action}
                          className="w-full px-5 py-4 flex items-center justify-between hover:bg-white/5 transition text-left group"
                        >
                          <div className="flex items-center gap-4">
                            <span style={{ color: accentColor }} className="text-lg w-6 text-center">
                              {row.icon}
                            </span>
                            <span className="text-sm font-semibold text-white group-hover:text-red-400 transition">
                              {row.label}
                            </span>
                          </div>
                          <span className="text-zinc-500 text-lg font-bold group-hover:translate-x-1 transition">›</span>
                        </button>
                      ))}
                    </div>
                  )}

                  <div className="text-center pt-4">
                    <span className="text-xs text-zinc-600 font-semibold">Version 25.0.7 • MAGNERSKING Royal Edition</span>
                  </div>
                </div>
              )}
            </main>
          ) : (
            /* Ej inloggad vy */
            <div className="flex-1 flex items-center justify-center p-6 z-10">
              <div className="bg-[#111215] p-10 rounded-3xl text-center space-y-4 max-w-sm border border-white/10 shadow-2xl">
                <div style={{ backgroundColor: accentColor }} className="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg">
                  👑
                </div>
                <h2 className="text-lg font-black text-white">MAGNERSKING IPTVX</h2>
                <p className="text-xs text-zinc-400">Logga in för att synka dina smarta mappar och ladda din spellista.</p>
                <button
                  onClick={() => setAuthModal(true)}
                  style={{ backgroundColor: accentColor }}
                  className="w-full text-white font-extrabold px-5 py-3 rounded-2xl text-xs shadow-lg"
                >
                  Logga in nu
                </button>
              </div>
            </div>
          )}

          {/* FLYTANDE MINI-PLAYER NERE TILL HÖGER NÄR MAN BLÄDDRAR RUNT */}
          {user && currentMedia && !isFullscreenPlayer && (
            <div className="fixed bottom-16 sm:bottom-6 left-4 sm:left-6 z-40 w-72 sm:w-80 rounded-2xl bg-[#111215]/95 backdrop-blur-xl border border-white/20 shadow-[0_20px_50px_rgba(0,0,0,0.9)] overflow-hidden flex items-center gap-3 p-2.5">
              <div
                onClick={() => setIsFullscreenPlayer(true)}
                className="w-12 h-12 rounded-xl bg-black border border-white/10 flex items-center justify-center shrink-0 cursor-pointer relative overflow-hidden"
              >
                {currentMedia.logo ? (
                  <img src={currentMedia.logo} alt="" className="max-w-full max-h-full object-contain" />
                ) : (
                  <span className="text-xs font-black text-[#E50914]">▶</span>
                )}
              </div>
              <div onClick={() => setIsFullscreenPlayer(true)} className="min-w-0 flex-1 cursor-pointer">
                <span className="text-[9px] font-black uppercase text-[#E50914] flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#E50914] live-dot" />
                  SPELAR NU
                </span>
                <p className="text-xs font-extrabold text-white truncate">{currentMedia.name}</p>
              </div>
              <button
                onClick={() => setIsFullscreenPlayer(true)}
                className="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-bold"
                title="Fullskärm"
              >
                ⛶
              </button>
              <button
                onClick={() => setCurrentMedia(null)}
                className="px-2 py-1.5 text-zinc-400 hover:text-white text-xs font-bold"
                title="Stäng"
              >
                ✕
              </button>
            </div>
          )}

          {/* RÖD RUNDA SVÄVANDE MENYKNAPP NERE TILL HÖGER (SOM I IPTVX SKÄRMDUMPARNA) */}
          {user && (
            <button
              onClick={() => setQuickDrawer(!quickDrawer)}
              style={{ backgroundColor: accentColor }}
              className="fixed bottom-16 sm:bottom-6 right-5 z-40 w-14 h-14 rounded-full text-white flex items-center justify-center text-2xl font-black shadow-[0_8px_30px_rgba(229,9,20,0.6)] hover:scale-105 transition"
              title="Snabbmeny"
            >
              {quickDrawer ? '✕' : '☰'}
            </button>
          )}

          {/* SNABBMENY-POPUP FRÅN DEN RÖDA KNAPPEN */}
          {quickDrawer && (
            <div className="fixed bottom-32 sm:bottom-24 right-5 z-40 w-64 rounded-2xl bg-[#121316]/95 backdrop-blur-xl border border-white/15 p-3 space-y-1.5 shadow-2xl">
              <div className="text-[10px] font-extrabold uppercase tracking-widest text-zinc-400 px-3 py-1">
                Snabbnavigering
              </div>
              {[
                { label: '🔍 Sök i hela katalogen', action: () => { setSearchModal(true); setQuickDrawer(false); } },
                { label: '★ Dina Smarta Mappar', action: () => { setManageFavModal(true); setQuickDrawer(false); } },
                { label: '📂 Ladda M3U / EPG', action: () => { setActiveTab('settings'); setSettingsSubView('sources'); setQuickDrawer(false); } },
                { label: '📺 Gå till Live TV', action: () => { setActiveTab('live'); setIsFullscreenPlayer(false); setQuickDrawer(false); } },
                { label: '📅 Gå till TV-guide', action: () => { setActiveTab('epg'); setIsFullscreenPlayer(false); setQuickDrawer(false); } }
              ].map((item, idx) => (
                <button
                  key={idx}
                  onClick={item.action}
                  className="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold text-white hover:bg-[#E50914] transition block"
                >
                  {item.label}
                </button>
              ))}
            </div>
          )}

          {/* DETALJ- & AVSNITTS-MODAL FÖR SERIER OCH FILMER */}
          {detailItem && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#121316] border border-white/15 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl my-auto">
                <div className="relative h-56 sm:h-64 bg-zinc-900 flex items-end p-6">
                  {detailItem.logo && (
                    <img src={detailItem.logo} alt="" className="absolute inset-0 w-full h-full object-cover opacity-50" />
                  )}
                  <div className="absolute inset-0 bg-gradient-to-t from-[#121316] via-[#121316]/50 to-transparent" />
                  <button
                    onClick={() => setDetailItem(null)}
                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/70 text-white flex items-center justify-center text-sm font-bold"
                  >
                    ✕
                  </button>
                  <div className="relative z-10 space-y-2 w-full">
                    <div className="flex items-center gap-2">
                      <span style={{ backgroundColor: accentColor }} className="text-[10px] font-black uppercase px-2 py-0.5 rounded text-white">
                        {detailItem.isSeriesShow ? 'SERIE' : 'DETALJER'}
                      </span>
                      <span className="text-xs text-amber-400 font-bold">★ {detailItem.rating || '8,1'}</span>
                      <span className="text-xs text-zinc-400">{detailItem.group}</span>
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-black text-white">{detailItem.name}</h2>
                  </div>
                </div>

                <div className="p-6 space-y-5 max-h-[60vh] overflow-y-auto thin-scrollbar">
                  <div className="flex flex-wrap gap-3">
                    <button
                      onClick={() => {
                        const firstTarget = detailItem.isSeriesShow ? detailItem.episodes[0] : detailItem;
                        startPlayback(firstTarget, true);
                      }}
                      className="bg-white hover:bg-zinc-200 text-black font-extrabold px-6 py-3 rounded-full text-xs flex items-center gap-2"
                    >
                      <span>▶</span>
                      <span>{detailItem.isSeriesShow ? 'Spela Avsnitt 1' : 'Spela upp nu'}</span>
                    </button>

                    <button
                      onClick={() => setFavModalItem(detailItem)}
                      className="bg-zinc-800 hover:bg-zinc-700 text-white font-bold px-5 py-3 rounded-full text-xs border border-white/10"
                    >
                      ★ Lägg i Favoriter
                    </button>

                    <button
                      onClick={() => openInExternalPlayer('vlc', detailItem.isSeriesShow ? detailItem.episodes[0] : detailItem)}
                      className="bg-[#FF6B00] text-white font-bold px-5 py-3 rounded-full text-xs"
                    >
                      🟠 Öppna i VLC
                    </button>
                  </div>

                  {/* Om det är en serie med flera avsnitt */}
                  {detailItem.isSeriesShow && detailItem.episodes?.length > 0 && (
                    <div className="space-y-3 pt-2 border-t border-white/10">
                      <div className="flex items-center justify-between">
                        <h3 className="text-sm font-extrabold text-white">
                          Avsnitt ({detailItem.episodes.length} st)
                        </h3>
                        {(() => {
                          const seasons = Array.from(new Set(detailItem.episodes.map((e) => e.season || 1))).sort((a, b) => a - b);
                          if (seasons.length <= 1) return null;
                          return (
                            <select
                              value={selectedSeason}
                              onChange={(e) => setSelectedSeason(parseInt(e.target.value, 10))}
                              className="bg-zinc-900 border border-white/15 rounded-xl px-3 py-1.5 text-xs font-bold text-white outline-none"
                            >
                              {seasons.map((s) => (
                                <option key={s} value={s}>Säsong {s}</option>
                              ))}
                            </select>
                          );
                        })()}
                      </div>

                      <div className="space-y-2">
                        {detailItem.episodes
                          .filter((ep) => !ep.season || ep.season === selectedSeason)
                          .map((ep, idx) => (
                            <div
                              key={ep.id}
                              onClick={() => startPlayback(ep, true)}
                              className="p-3 rounded-xl bg-black/60 hover:bg-white/10 border border-white/10 flex items-center justify-between cursor-pointer transition"
                            >
                              <div className="flex items-center gap-3 min-w-0">
                                <span className="text-xs font-black text-zinc-500 w-6">{ep.episode || idx + 1}.</span>
                                <span className="text-xs font-bold text-white truncate">{ep.name}</span>
                              </div>
                              <span className="text-xs font-extrabold text-[#E50914] shrink-0">▶ Spela</span>
                            </div>
                          ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* GLOBAL SÖK-MODAL */}
          {searchModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex flex-col p-4 sm:p-8">
              <div className="max-w-4xl mx-auto w-full space-y-5 flex-1 flex flex-col overflow-hidden">
                <div className="flex items-center gap-3">
                  <div className="relative flex-1">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">🔍</span>
                    <input
                      type="text"
                      autoFocus
                      placeholder="Sök efter kanaler, filmer, serier eller kategorier..."
                      value={globalSearch}
                      onChange={(e) => setGlobalSearch(e.target.value)}
                      className="w-full bg-zinc-900 border border-white/20 focus:border-[#E50914] rounded-2xl pl-11 pr-4 py-3.5 text-sm text-white outline-none"
                    />
                  </div>
                  <button
                    onClick={() => { setSearchModal(false); setGlobalSearch(''); }}
                    className="bg-zinc-800 hover:bg-zinc-700 px-4 py-3.5 rounded-2xl text-xs font-extrabold"
                  >
                    Stäng
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto thin-scrollbar grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5 content-start">
                  {searchResults.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => {
                        setSearchModal(false);
                        handleCardSelect(item);
                      }}
                      className="p-3 rounded-2xl bg-zinc-900/90 border border-white/10 hover:border-[#E50914] cursor-pointer flex items-center gap-3 transition"
                    >
                      <div className="w-11 h-11 rounded-xl bg-black flex items-center justify-center p-1 shrink-0 overflow-hidden">
                        {item.logo ? (
                          <img src={item.logo} alt="" loading="lazy" className="max-w-full max-h-full object-contain" />
                        ) : (
                          <span className="text-xs font-bold text-[#E50914]">▶</span>
                        )}
                      </div>
                      <div className="min-w-0 flex-1">
                        <span className="text-[9px] font-black uppercase text-amber-400 block">{item.type}</span>
                        <h4 className="text-xs font-bold text-white truncate">{item.name}</h4>
                        <p className="text-[10px] text-zinc-400 truncate">{item.group}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* INLOGGNINGS-MODAL */}
          {authModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
              <div className="bg-[#111215] border border-white/15 rounded-3xl w-full max-w-sm p-7 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">👑</span>
                    <h3 className="font-extrabold text-base text-white">{isSignUp ? 'Skapa Royal-konto' : 'Logga in i MAGNERSKING'}</h3>
                  </div>
                  {user && (
                    <button onClick={() => setAuthModal(false)} className="text-sm font-bold text-zinc-400 hover:text-white">
                      ✕
                    </button>
                  )}
                </div>

                <div className="p-3.5 bg-black/60 border border-white/10 rounded-2xl">
                  <p className="text-[11px] text-zinc-400 leading-relaxed text-center">
                    <strong className="text-amber-400">Användarvillkor:</strong> Denna applikation tillhandahåller enbart en mediaspelare. Användaren ansvarar fullt ut för att endast använda lagliga M3U-filer och strömmar.
                  </p>
                </div>

                <form onSubmit={handleAuth} className="space-y-3.5" autoComplete="on">
                  <input
                    ref={emailInputRef}
                    type="email"
                    defaultValue={savedEmailDefault}
                    placeholder="E-postadress"
                    autoComplete="email"
                    className="w-full bg-black border border-white/15 focus:border-[#E50914] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <input
                    ref={passwordInputRef}
                    type="password"
                    placeholder="Lösenord"
                    autoComplete="current-password"
                    className="w-full bg-black border border-white/15 focus:border-[#E50914] rounded-2xl px-4 py-3 text-xs text-white outline-none"
                    required
                  />
                  <button
                    type="submit"
                    style={{ backgroundColor: accentColor }}
                    className="w-full text-white font-extrabold py-3 rounded-2xl text-xs shadow-lg transition hover:brightness-110"
                  >
                    {isSignUp ? 'Registrera Konto' : 'Logga in'}
                  </button>
                </form>
                <div className="text-center pt-1">
                  <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-amber-400 hover:underline font-semibold">
                    {isSignUp ? 'Har du redan konto? Logga in' : 'Inget konto? Skapa ett här'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LÄGG TILL I FAVORITMAPP-MODAL */}
          {favModalItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#121316] border border-white/20 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-sm text-white">★ Lägg till i Favoritmapp</h3>
                  <button onClick={() => setFavModalItem(null)} className="text-sm font-bold text-zinc-400">
                    ✕
                  </button>
                </div>
                <div className="space-y-2">
                  {favLists.map((list) => {
                    const checked = (list.channelIds || []).includes(favModalItem.id);
                    return (
                      <div
                        key={list.id}
                        onClick={() => toggleChannelInFavList(list.id, favModalItem.id)}
                        className={`p-3.5 rounded-2xl border flex justify-between items-center cursor-pointer transition ${
                          checked ? 'bg-red-950/60 border-[#E50914] text-white' : 'bg-black/50 border-white/10 text-zinc-300'
                        }`}
                      >
                        <span className="text-xs font-bold">★ {list.name}</span>
                        <span className="text-xs font-extrabold text-amber-400">{checked ? '✓ Tillagd' : '+ Välj'}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* HANTERA SMARTA FAVORITMAPPAR-MODAL */}
          {manageFavModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#121316] border border-white/20 rounded-3xl w-full max-w-md p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-extrabold text-base text-white">👑 Smarta Favoritmappar</h3>
                  <button onClick={() => setManageFavModal(false)} className="text-sm font-bold text-zinc-400 hover:text-white">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleCreateFavList} className="space-y-3.5 bg-black/60 p-4 rounded-2xl border border-white/10">
                  <p className="text-xs text-amber-400 font-bold">Skapa ny mapp (Manuell eller Auto-regel):</p>
                  <input
                    type="text"
                    placeholder="1. Namn på favoritmappen (t.ex. Sverige FHD)"
                    value={newListName}
                    onChange={(e) => setNewListName(e.target.value)}
                    className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                    required
                  />
                  <select
                    value={newListGroup}
                    onChange={(e) => setNewListGroup(e.target.value)}
                    className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                  >
                    <option value="ALL">Alla mappar (eller välj en specifik nedan)</option>
                    {allAvailableGroups.map((grp) => (
                      <option key={grp} value={grp}>📁 {grp}</option>
                    ))}
                  </select>
                  <input
                    type="text"
                    placeholder="3. Namn måste innehålla (t.ex. FHD, 4K, SVT...)"
                    value={newListFilter}
                    onChange={(e) => setNewListFilter(e.target.value)}
                    className="w-full bg-zinc-900 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none"
                  />
                  <button
                    type="submit"
                    style={{ backgroundColor: accentColor }}
                    className="w-full text-white font-extrabold py-2.5 rounded-xl text-xs shadow-lg"
                  >
                    + Skapa & Synka Smart Mapp
                  </button>
                </form>

                <div className="space-y-2 max-h-48 overflow-y-auto thin-scrollbar">
                  {favLists.map((list) => {
                    const items = favItemsById[list.id] || [];
                    return (
                      <div key={list.id} className="p-3.5 rounded-2xl bg-black/60 border border-white/10 flex justify-between items-center">
                        <div>
                          <span className="text-xs font-bold text-white block">
                            ★ {list.name} ({items.length} st)
                          </span>
                          {(list.filter || (list.filterGroup && list.filterGroup !== 'ALL')) && (
                            <span className="text-[10px] text-amber-400">
                              Regel: {list.filterGroup && list.filterGroup !== 'ALL' ? list.filterGroup : 'Alla'}{' '}
                              {list.filter ? `+ "${list.filter}"` : ''}
                            </span>
                          )}
                        </div>
                        <button onClick={() => handleDeleteFavList(list.id)} className="text-xs text-red-400 hover:text-red-300 font-bold">
                          Ta bort
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* MOBIL BOTTENMENY (SYNS PÅ MOBIL/SURFPLATTA FÖR ÄKTA APP-KÄNSLA) */}
          {user && (
            <nav className="sm:hidden fixed bottom-0 left-0 right-0 h-14 bg-black/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around z-30 px-2">
              {[
                { id: 'home', label: 'För dig', icon: '🏠' },
                { id: 'movies', label: 'Film', icon: '🎬' },
                { id: 'series', label: 'Serie', icon: '🍿' },
                { id: 'live', label: 'Live', icon: '📺' },
                { id: 'epg', label: 'TV-guide', icon: '📅' },
                { id: 'settings', label: 'Meny', icon: '⚙️' }
              ].map((t) => {
                const active = activeTab === t.id && !isFullscreenPlayer;
                return (
                  <button
                    key={t.id}
                    onClick={() => {
                      setActiveTab(t.id);
                      setExpandedCategory(null);
                      setIsFullscreenPlayer(false);
                    }}
                    className={`flex flex-col items-center justify-center py-1 px-2 ${
                      active ? 'text-[#E50914] font-extrabold' : 'text-zinc-400'
                    }`}
                  >
                    <span className="text-base leading-none">{t.icon}</span>
                    <span className="text-[9px] mt-1">{t.label}</span>
                  </button>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

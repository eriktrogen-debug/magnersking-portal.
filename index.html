      const loadEpgFromUrl = async (urlToLoad) => {
        const target = (typeof urlToLoad === 'string' ? urlToLoad : epgUrl).trim();
        if (!target) {
          setEpgStatus('⚠️ Fyll i en giltig EPG XMLTV-länk först (eller välj en .xml/.xml.gz-fil).');
          return;
        }

        setIsEpgLoading(true);
        setEpgStatus('⏳ Synkar TV-tablå (EPG)...');
        try { localStorage.setItem('zp_saved_epg_url', target); } catch (e) {}

        try {
          let arrayBuf = null;
          const urlsToTry = [
            target,
            'https://corsproxy.io/?' + encodeURIComponent(target),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(target)
          ];

          for (const candidate of urlsToTry) {
            try {
              const res = await fetch(candidate);
              if (res.ok) {
                arrayBuf = await res.arrayBuffer();
                if (arrayBuf && arrayBuf.byteLength > 50) break;
              }
            } catch (innerErr) {}
          }

          if (!arrayBuf) {
            throw new Error('Kunde inte nå EPG-servern via länk.');
          }

          const uint8 = new Uint8Array(arrayBuf);
          let xmlText = '';
          if (uint8[0] === 0x1f && uint8[1] === 0x8b && window.pako) {
            xmlText = window.pako.ungzip(uint8, { to: 'string' });
          } else {
            xmlText = new TextDecoder('utf-8').decode(uint8);
          }

          const parsedEpg = parseXMLTV(xmlText);
          const count = Object.keys(parsedEpg).length;
          if (count > 0) {
            setEpgData(parsedEpg);
            if (user) await saveLocalCache(`epg_${user.id}`, parsedEpg);
            saveToCloud(favLists, m3uUrl || savedM3uUrl, target);
            setEpgStatus(`✅ EPG synkad! Laddade programtablå för ${count} kanaler/alias.`);
          } else {
            setEpgStatus('⚠️ EPG-filen lästes in men innehöll inga aktuella program för idag.');
          }
        } catch (err) {
          setEpgStatus('❌ Kunde ej hämta EPG via länk (CORS-spärr hos leverantören). Ladda ner .xml/.xml.gz-filen och välj den i steg 3 ovan!');
        } finally {
          setIsEpgLoading(false);
        }
      };

      const handleEpgFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsEpgLoading(true);
        setEpgStatus(`⏳ Synkar TV-tablå från "${file.name}"...`);

        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              const uint8 = new Uint8Array(ev.target.result);
              let xmlText = '';
              if ((uint8[0] === 0x1f && uint8[1] === 0x8b) && window.pako) {
                xmlText = window.pako.ungzip(uint8, { to: 'string' });
              } else {
                xmlText = new TextDecoder('utf-8').decode(uint8);
              }

              const parsedEpg = parseXMLTV(xmlText);
              const count = Object.keys(parsedEpg).length;
              if (count > 0) {
                setEpgData(parsedEpg);
                if (user) await saveLocalCache(`epg_${user.id}`, parsedEpg);
                setEpgStatus(`✅ EPG klar! Tablå laddad för ${count} kanaler/alias.`);
              } else {
                setEpgStatus('⚠️ Inga aktuella program hittades i XML-filen.');
              }
            } catch (err) {
              setEpgStatus('❌ Kunde ej tolka XML/GZ-filen.');
            } finally {
              setIsEpgLoading(false);
            }
          };
          reader.onerror = () => {
            setEpgStatus('❌ Fel vid läsning av fil.');
            setIsEpgLoading(false);
          };
          reader.readAsArrayBuffer(file);
        }, 50);
      };

      const applyParsedData = async (parsed, sourceM3uUrl = '') => {
        const newLive = parsed.live.length > 0 ? parsed.live : INITIAL_CHANNELS;
        const newVodChannels = parsed.vodChannels || [];
        const newMovies = parsed.movies || [];
        const newSeries = parsed.series || [];

        setChannels(newLive);
        setVodChannels(newVodChannels);
        setMovies(newMovies);
        setSeries(newSeries);
        setNeedsDeviceSyncReload(false);

        const finalM3u = sourceM3uUrl || m3uUrl || savedM3uUrl;
        const finalEpg = parsed.detectedEpgUrl || epgUrl;

        if (user) {
          await saveLocalCache(`media_${user.id}`, {
            channels: newLive,
            vodChannels: newVodChannels,
            movies: newMovies,
            series: newSeries,
            m3uUrl: finalM3u,
            epgUrl: finalEpg
          });
        }

        saveToCloud(favLists, finalM3u, finalEpg);
        setStatusMsg(
          `✅ Klar! Sparade ${newLive.length} livekanaler, ${newVodChannels.length} VOD-kanaler, ${newMovies.length} filmer och ${newSeries.length} serieavsnitt.`
        );

        if (parsed.detectedEpgUrl && !epgUrl) {
          setEpgUrl(parsed.detectedEpgUrl);
          loadEpgFromUrl(parsed.detectedEpgUrl);
        }
      };

      const handleFileUpload = (e) => {
        if (!user) return;
        const file = e.target.files?.[0];
        if (!file) return;
        setIsM3uLoading(true);
        setStatusMsg(`⏳ Läser in och sorterar "${file.name}"...`);
        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              const parsed = parseM3U(ev.target.result);
              await applyParsedData(parsed);
            } finally {
              setIsM3uLoading(false);
            }
          };
          reader.readAsText(file);
        }, 50);
      };

      const handleLoadM3uUrl = async (e) => {
        if (e) e.preventDefault();
        if (!user) return;
        const urlToFetch = (m3uUrl || savedM3uUrl).trim();
        if (!urlToFetch) {
          setStatusMsg('⚠️ Ange en M3U-länk i textfältet först.');
          return;
        }

        setIsM3uLoading(true);
        setStatusMsg('⏳ Hämtar spellista från länk...');
        try { localStorage.setItem('zp_saved_m3u_url', urlToFetch); } catch (e) {}

        try {
          let text = '';
          const candidates = [
            urlToFetch,
            'https://corsproxy.io/?' + encodeURIComponent(urlToFetch),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(urlToFetch)
          ];

          for (const urlCandidate of candidates) {
            try {
              const res = await fetch(urlCandidate);
              if (res.ok) {
                const body = await res.text();
                if (body && body.includes('#EXT')) {
                  text = body;
                  break;
                }
              }
            } catch (inner) {}
          }

          if (!text) throw new Error('Kunde ej hämta M3U');

          const parsed = parseM3U(text);
          setSavedM3uUrl(urlToFetch);
          await applyParsedData(parsed, urlToFetch);
        } catch (err) {
          setStatusMsg('❌ CORS-spärr på M3U-länken i webbläsaren. Ladda upp M3U-filen direkt i steg 1 ovan!');
        } finally {
          setIsM3uLoading(false);
        }
      };

      const handleSyncReloadOnThisDevice = async () => {
        if (m3uUrl || savedM3uUrl) {
          await handleLoadM3uUrl();
        }
        if (epgUrl) {
          await loadEpgFromUrl(epgUrl);
        }
      };

      const handleClearCache = async () => {
        if (!user) return;
        await saveLocalCache(`media_${user.id}`, null);
        await saveLocalCache(`epg_${user.id}`, null);
        await saveLocalCache(`history_${user.id}`, null);
        setChannels(INITIAL_CHANNELS);
        setVodChannels([]);
        setMovies([]);
        setSeries([]);
        setWatchHistory([]);
        setWatchProgress({});
        setEpgData({});
        setStatusMsg('✅ Lokal mediedata har rensats (dina M3U- och EPG-länkar ligger kvar).');
      };

      const openGenreFilter = (genreObj) => {
        const allVod = [...recentlyAddedMovies, ...recentlyAddedSeries];
        const matches = allVod.filter((item) => {
          const hay = `${item.name} ${item.group}`.toLowerCase();
          return genreObj.keywords.some((kw) => hay.includes(kw));
        });
        setExpandedCategory({
          title: `Genre: ${genreObj.label}`,
          items: matches.length > 0 ? matches : allVod.slice(0, 60)
        });
      };

      const openYearFilter = (yr) => {
        const allVod = [...recentlyAddedMovies, ...recentlyAddedSeries];
        const matches = allVod.filter((item) => item.year === yr || item.name.includes(yr));
        setExpandedCategory({
          title: `Utforska år: ${yr}`,
          items: matches
        });
      };

      const savedEmailDefault = useMemo(() => {
        try { return localStorage.getItem('zp_saved_email') || localStorage.getItem('mk_saved_email') || ''; } catch (e) { return ''; }
      }, []);

      const activeChannelEpg = useMemo(() => getChannelEpg(currentMedia), [currentMedia, epgData]);

      const epgFilteredChannels = useMemo(() => {
        let baseList = channels;
        if (epgSelectedFolder === 'ALL_FAV') {
          baseList = liveFavoritesOnly;
        } else if (epgSelectedFolder.startsWith('FAV:')) {
          const favId = epgSelectedFolder.replace('FAV:', '');
          baseList = (favItemsById[favId] || []).filter((x) => x.type === 'live' || x.type === 'vod_channel');
        } else if (epgSelectedFolder.startsWith('GRP:')) {
          const grpName = epgSelectedFolder.replace('GRP:', '');
          baseList = liveGroups[grpName] || [];
        }

        if (!epgSearch.trim()) return baseList;
        const q = epgSearch.toLowerCase().trim();
        return baseList.filter((ch) => ch.name.toLowerCase().includes(q) || (ch.group && ch.group.toLowerCase().includes(q)));
      }, [channels, epgSelectedFolder, liveFavoritesOnly, favItemsById, liveGroups, epgSearch]);

      const isLiveOrVodCh = currentMedia && (currentMedia.type === 'live' || currentMedia.type === 'vod_channel');

      return (
        <div className={`w-full h-screen bg-black flex flex-col overflow-hidden text-white relative ${tvMode ? 'text-lg' : ''}`}>
          
          {/* TOPP-NAVIGERING */}
          <header className="h-16 sm:h-20 bg-gradient-to-b from-black/95 via-black/80 to-transparent px-4 sm:px-8 flex items-center justify-between shrink-0 z-30 border-b border-white/5">
            <div className="flex items-center gap-5 sm:gap-7 min-w-0">
              <div
                onClick={() => { setActiveTab('home'); setExpandedCategory(null); setIsFullscreenPlayer(false); }}
                className="flex items-center gap-2.5 cursor-pointer shrink-0 group"
              >
                <div
                  style={{ backgroundColor: accentColor }}
                  className="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-[#D4A346] flex items-center justify-center text-black font-black text-lg shadow-[0_0_25px_rgba(243,208,120,0.45)] group-hover:scale-105 transition"
                >
                  Z
                </div>
                <div className="hidden sm:block">
                  <span className="font-black tracking-wider text-base text-white block leading-none">ZAPPAPORTALEN</span>
                  <span className="text-[9px] font-bold tracking-widest uppercase text-[#F3D078] block mt-0.5">
                    {appEdition === 'free' && !isSubscriber ? 'FREE AD-EDITION' : 'ROYAL EDITION'}
                  </span>
                </div>
              </div>

              {user && (
                <nav className="flex items-center gap-4 sm:gap-5 overflow-x-auto no-scrollbar py-2">
                  {[
                    { id: 'home', label: tr.home },
                    { id: 'movies', label: tr.movies, count: movies.length },
                    { id: 'series', label: tr.series, count: groupedSeriesCatalog.length },
                    { id: 'vod_channels', label: tr.vod_channels, count: vodChannels.length },
                    { id: 'live', label: tr.live, count: channels.length },
                    { id: 'epg', label: tr.epg },
                    { id: 'settings', label: tr.settings }
                  ].map((tab) => {
                    const isActive = activeTab === tab.id && !isFullscreenPlayer;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => {
                          setActiveTab(tab.id);
                          setExpandedCategory(null);
                          setIsFullscreenPlayer(false);
                          setSettingsSubView(null);
                        }}
                        className={`relative py-2 text-xs sm:text-sm font-bold whitespace-nowrap transition-colors flex items-center gap-1.5 ${
                          isActive ? 'text-white' : 'text-zinc-400 hover:text-zinc-200'
                        }`}
                      >
                        <span>{tab.label}</span>
                        {tab.count > 0 && (
                          <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-white/10 text-zinc-300 font-semibold">
                            {tab.count}
                          </span>
                        )}
                        {isActive && (
                          <span
                            style={{ backgroundColor: accentColor }}
                            className="absolute bottom-0 left-0 right-0 h-[3px] rounded-full shadow-[0_0_10px_#F3D078]"
                          />
                        )}
                      </button>
                    );
                  })}
                </nav>
              )}
            </div>

            {user && (
              <div className="flex items-center gap-2.5 sm:gap-3 shrink-0">
                <select
                  value={lang}
                  onChange={(e) => {
                    setLang(e.target.value);
                    try { localStorage.setItem('zp_lang', e.target.value); } catch (err) {}
                  }}
                  className="bg-zinc-900 border border-white/15 rounded-full px-2.5 py-1.5 text-[11px] font-bold text-zinc-200 outline-none cursor-pointer hover:border-[#F3D078]"
                  title="Välj språk / Language"
                >
                  <option value="sv">🇸🇪 SV</option>
                  <option value="en">🇬🇧 EN</option>
                  <option value="de">🇩🇪 DE</option>
                </select>

                <button
                  onClick={() => setSearchModal(true)}
                  className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-sm transition"
                  title="Sök i hela katalogen"
                >
                  🔍
                </button>

                <button
                  onClick={() => setManageFavModal(true)}
                  className="hidden md:flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 border border-[#F3D078]/30 px-3.5 py-2 rounded-full text-xs font-bold text-[#F3D078] transition"
                >
                  <span>★</span>
                  <span>{tr.smartFolders}</span>
                </button>

                <div
                  onClick={() => { setActiveTab('settings'); setIsFullscreenPlayer(false); }}
                  className="relative flex items-center gap-2 cursor-pointer group"
                  title="Inställningar & Konto"
                >
                  <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-tr from-[#D4A346] via-[#F3D078] to-amber-200 p-0.5 shadow-lg">
                    <div className="w-full h-full rounded-full bg-zinc-950 flex items-center justify-center font-black text-xs text-[#F3D078]">
                      {user.email ? user.email.substring(0, 2).toUpperCase() : 'ZP'}
                    </div>
                  </div>
                  <span className="w-4 h-4 rounded-full bg-zinc-900 border border-white/20 flex items-center justify-center text-[9px] absolute -bottom-0.5 -right-0.5">
                    ⌄
                  </span>
                </div>
              </div>
            )}
          </header>

          {/* GLOBAL LADDNINGSINDIKATOR VID EPG-SYNK */}
          {isEpgLoading && (
            <div className="bg-[#F3D078] text-black text-xs font-black py-1.5 px-4 text-center z-40 shadow flex items-center justify-center gap-2">
              <span className="w-3.5 h-3.5 border-2 border-black border-t-transparent rounded-full spinner inline-block" />
              <span>{tr.syncingEpg}</span>
            </div>
          )}

          {/* VISUELL NOTIS VID EXTERN SPELARE */}
          {externalPlayerNotice && (
            <div className="bg-[#F3D078] text-black text-xs font-extrabold py-2 px-4 text-center z-40 shadow-lg flex items-center justify-center gap-3">
              <span>{externalPlayerNotice}</span>
              <button
                onClick={() => downloadSingleM3U(currentMedia)}
                className="underline bg-black text-[#F3D078] px-2.5 py-0.5 rounded-lg text-[11px]"
              >
                Ladda ner .m3u-fil nu
              </button>
            </div>
          )}

          {/* HUVUDINNEHÅLL */}
          {user ? (
            <main className="flex-1 overflow-y-auto thin-scrollbar pb-28 relative z-10">
              
              {/* BANNER FÖR NY ENHET */}
              {needsDeviceSyncReload && (m3uUrl || savedM3uUrl) && (
                <div className="mx-4 sm:mx-8 mt-4 p-4 rounded-2xl bg-amber-950/70 border border-[#F3D078] flex flex-wrap items-center justify-between gap-3 shadow-lg">
                  <div className="space-y-0.5">
                    <p className="text-xs font-extrabold text-[#F3D078]">📲 Dina M3U- och EPG-länkar är synkade på denna enhet!</p>
                    <p className="text-[11px] text-zinc-300">
                      Länkarna ligger sparade, men du behöver läsa in själva kanal- och tablådatan lokalt på denna enhet.
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleSyncReloadOnThisDevice}
                      disabled={isM3uLoading || isEpgLoading}
                      style={{ backgroundColor: accentColor }}
                      className="text-black font-extrabold px-4 py-2 rounded-xl text-xs shadow hover:brightness-110 transition"
                    >
                      {isM3uLoading || isEpgLoading ? '⏳ Laddar in...' : '🔄 Läs in M3U & EPG nu'}
                    </button>
                    <button
                      onClick={() => { setActiveTab('settings'); setSettingsSubView('sources'); }}
                      className="bg-zinc-900 text-white px-3 py-2 rounded-xl text-xs font-bold border border-white/15"
                    >
                      Öppna Källor
                    </button>
                  </div>
                </div>
              )}

              {/* ============================================================================
                  FULLSKÄRMS- / HUVUDSPELARVY MED ÄKTA TV-ZAPPNING (CH- / CH+) & ZAPPLISTA
              ============================================================================ */}
              {isFullscreenPlayer && currentMedia && (
                <div className="max-w-6xl mx-auto px-4 sm:px-8 py-4 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setIsFullscreenPlayer(false)}
                        className="bg-zinc-900 hover:bg-zinc-800 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition"
                      >
                        <span>←</span>
                        <span>Mini-player</span>
                      </button>

                      {/* ZAPP-KNAPPAR (CH- / CH+) DIREKT OVANFÖR SPELAREN */}
                      {isLiveOrVodCh && currentZapPlaylist.length > 1 && (
                        <div className="flex items-center gap-1.5 bg-[#121316] p-1 rounded-xl border border-[#F3D078]/40 shadow-lg">
                          <button
                            onClick={() => zapToChannel(-1)}
                            className="bg-zinc-900 hover:bg-[#F3D078] text-white hover:text-black font-extrabold px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1"
                            title="Pil Ner / Föregående kanal"
                          >
                            <span>⏮</span>
                            <span>CH -</span>
                          </button>
                          <span className="text-[11px] font-black text-[#F3D078] px-2">
                            {currentZapIndex !== -1 ? `${currentZapIndex + 1} / ${currentZapPlaylist.length}` : 'TV'}
                          </span>
                          <button
                            onClick={() => zapToChannel(1)}
                            className="bg-[#F3D078] hover:brightness-110 text-black font-extrabold px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1 shadow"
                            title="Pil Upp / Nästa kanal"
                          >
                            <span>CH +</span>
                            <span>⏭</span>
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="flex items-center gap-1.5 bg-zinc-900/90 p-1 rounded-xl border border-white/10">
                      {[
                        { id: 'auto', label: 'Auto Smart (Proxy+HLS)' },
                        { id: 'mpegts', label: 'MPEG-TS (.ts)' },
                        { id: 'hls', label: 'HLS (.m3u8)' },
                        { id: 'native', label: 'HTML5 Direkt' }
                      ].map((eng) => (
                        <button
                          key={eng.id}
                          onClick={() => setPlayerEngine(eng.id)}
                          style={playerEngine === eng.id ? { backgroundColor: accentColor } : {}}
                          className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition ${
                            playerEngine === eng.id ? 'text-black font-extrabold shadow' : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          {eng.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Videospelare + TV OSD-Banner + Sponsrad Zapp-paus */}
                  <div className="relative w-full aspect-video bg-black rounded-2xl border border-white/15 shadow-[0_25px_70px_rgba(0,0,0,0.95)] overflow-hidden group/player">
                    <video
                      ref={videoRef}
                      controls
                      playsInline
                      autoPlay
                      onTimeUpdate={handleTimeUpdate}
                      className="w-full h-full object-contain bg-black"
                    />

                    {/* Flytande CH- / CH+ knappar på sidorna av videon vid hover */}
                    {isLiveOrVodCh && currentZapPlaylist.length > 1 && zapAdCountdown <= 0 && (
                      <>
                        <button
                          onClick={() => zapToChannel(-1)}
                          title="Föregående kanal (CH -)"
                          className="opacity-0 group-hover/player:opacity-100 transition-opacity absolute left-3 top-1/2 -translate-y-1/2 z-20 bg-black/75 hover:bg-[#F3D078] text-white hover:text-black border border-white/20 rounded-2xl px-3 py-4 flex flex-col items-center gap-1 shadow-2xl"
                        >
                          <span className="text-lg font-black">⏮</span>
                          <span className="text-[10px] font-extrabold uppercase">CH -</span>
                        </button>
                        <button
                          onClick={() => zapToChannel(1)}
                          title="Nästa kanal (CH +)"
                          className="opacity-0 group-hover/player:opacity-100 transition-opacity absolute right-3 top-1/2 -translate-y-1/2 z-20 bg-black/75 hover:bg-[#F3D078] text-white hover:text-black border border-white/20 rounded-2xl px-3 py-4 flex flex-col items-center gap-1 shadow-2xl"
                        >
                          <span className="text-lg font-black">⏭</span>
                          <span className="text-[10px] font-extrabold uppercase">CH +</span>
                        </button>
                      </>
                    )}

                    {/* TV-OSD BANNER VID KANALBYTE */}
                    {zapBannerInfo && zapAdCountdown <= 0 && (
                      <div className="absolute top-4 left-4 right-4 sm:right-auto sm:min-w-[360px] z-30 bg-black/90 backdrop-blur-xl border-2 border-[#F3D078] rounded-2xl p-3.5 flex items-center gap-3.5 shadow-2xl pointer-events-none">
                        <div className="w-12 h-12 rounded-xl bg-[#F3D078] text-black font-black text-base flex flex-col items-center justify-center shrink-0">
                          <span className="text-[9px] uppercase leading-none">CH</span>
                          <span>{zapBannerInfo.number}</span>
                        </div>
                        <div className="min-w-0 flex-1">
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#F3D078] block">
                            ZAPPAR KANAL ({zapBannerInfo.number} AV {zapBannerInfo.total})
                          </span>
                          <h4 className="text-sm sm:text-base font-black text-white truncate">{zapBannerInfo.channel.name}</h4>
                          <p className="text-[11px] text-zinc-300 truncate">
                            {getChannelEpg(zapBannerInfo.channel)?.currentProg?.title || zapBannerInfo.channel.group}
                          </p>
                        </div>
                      </div>
                    )}

                    {/* 5-SEKUNDERS SPONSRAT ZAPP-AVBROTT I GRATISVERSIONEN (VAR 4:E ZAPPNING) */}
                    {zapAdCountdown > 0 && (
                      <div className="absolute inset-0 z-40 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center space-y-4">
                        <span className="bg-[#F3D078] text-black text-[10px] font-black uppercase px-3 py-1 rounded-full">
                          SPONSRAT ZAPP-AVBROTT • GRATISVERSIONEN ({zapAdCountdown} s)
                        </span>
                        <h3 className="text-lg sm:text-2xl font-black text-white max-w-lg">
                          Byter till <span className="text-[#F3D078]">{pendingZapChannel?.name}</span> om {zapAdCountdown} sekunder...
                        </h3>
                        <p className="text-xs text-zinc-300 max-w-md">
                          I gratisversionen visas en kort sponsrad paus var 4:e gång du zappar. Med <strong className="text-[#F3D078]">Zappaportalen Royal</strong> zappar du blixtsnabbt utan reklam!
                        </p>
                        <button
                          onClick={() => {
                            setZapAdCountdown(0);
                            setPaywallModal(true);
                          }}
                          style={{ backgroundColor: accentColor }}
                          className="text-black font-extrabold px-6 py-3 rounded-full text-xs shadow-lg hover:scale-105 transition"
                        >
                          👑 Lås upp Omedelbar Zappning utan reklam (Royal)
                        </button>
                      </div>
                    )}

                    {videoError && zapAdCountdown <= 0 && (
                      <div className="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-6 text-center space-y-4 z-30">
                        <span className="bg-[#F3D078] text-black text-[10px] font-black uppercase px-2.5 py-1 rounded-md flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-black live-dot" />
                          RESERVSPELARE TILLGÄNGLIG
                        </span>
                        <p className="text-white font-bold text-base sm:text-lg max-w-md">
                          Strömmen kunde inte startas direkt – välj reservknapp eller zappa vidare
                        </p>
                        <p className="text-xs text-zinc-400 max-w-md">{videoError}</p>
                        <div className="flex flex-wrap items-center justify-center gap-2.5 pt-2">
                          {isLiveOrVodCh && (
                            <button
                              onClick={() => zapToChannel(1)}
                              style={{ backgroundColor: accentColor }}
                              className="text-black font-extrabold px-5 py-2.5 rounded-xl text-xs shadow-lg transition"
                            >
                              ⏭ Zappa till nästa kanal (CH +)
                            </button>
                          )}
                          <button
                            onClick={() => openInExternalPlayer('vlc', currentMedia)}
                            className="bg-[#FF6B00] hover:bg-[#e55f00] text-white font-extrabold px-5 py-2.5 rounded-xl text-xs shadow-lg transition"
                          >
                            🟠 Öppna i VLC
                          </button>
                          <button
                            onClick={() => downloadSingleM3U(currentMedia)}
                            className="bg-zinc-800 hover:bg-zinc-700 text-[#F3D078] font-extrabold px-4 py-2.5 rounded-xl text-xs border border-white/10 transition"
                          >
                            📥 Ladda ner .m3u
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* SNABB-ZAPPLISTA DIREKT UNDER SPELAREN FÖR MAXIMAL TV-KÄNSLA */}
                  {isLiveOrVodCh && currentZapPlaylist.length > 1 && (
                    <div className="bg-[#0E0F12] border border-white/10 rounded-2xl p-3.5 space-y-2.5">
                      <div className="flex items-center justify-between px-1">
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-[#F3D078] flex items-center gap-2">
                          <span>📺 Snabb-zapplista ({currentZapPlaylist.length} kanaler i aktiv lista)</span>
                          <span className="hidden sm:inline text-zinc-400 font-normal">• Tips: Använd Pil Upp / Pil Ner på tangentbordet för att zappa!</span>
                        </span>
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => zapToChannel(-1)}
                            className="bg-zinc-800 hover:bg-[#F3D078] text-white hover:text-black font-bold px-3 py-1 rounded-lg text-[11px] transition"
                          >
                            {tr.prevChannel}
                          </button>
                          <button
                            onClick={() => zapToChannel(1)}
                            className="bg-[#F3D078] hover:brightness-110 text-black font-extrabold px-3 py-1 rounded-lg text-[11px] transition"
                          >
                            {tr.nextChannel}
                          </button>
                        </div>
                      </div>

                      <div className="flex items-center gap-2.5 overflow-x-auto thin-scrollbar py-1">
                        {currentZapPlaylist.slice(Math.max(0, currentZapIndex - 15), Math.max(30, currentZapIndex + 25)).map((ch) => {
                          const active = ch.id === currentMedia.id;
                          const chEpg = getChannelEpg(ch);
                          return (
                            <div
                              key={ch.id}
                              onClick={() => zapToChannel(ch)}
                              className={`shrink-0 w-48 p-2.5 rounded-xl border cursor-pointer transition flex items-center gap-2.5 ${
                                active
                                  ? 'bg-[#F3D078]/15 border-[#F3D078] shadow-[0_0_15px_rgba(243,208,120,0.25)]'
                                  : 'bg-black/60 border-white/10 hover:border-white/30'
                              }`}
                            >
                              <div className="w-9 h-9 rounded-lg bg-black border border-white/10 flex items-center justify-center p-1 shrink-0">
                                {ch.logo ? (
                                  <img src={ch.logo} alt="" loading="lazy" className="max-w-full max-h-full object-contain" />
                                ) : (
                                  <span className="text-[9px] font-black text-[#F3D078]">TV</span>
                                )}
                              </div>
                              <div className="min-w-0 flex-1">
                                <p className={`text-xs font-extrabold truncate ${active ? 'text-[#F3D078]' : 'text-white'}`}>
                                  {ch.name}
                                </p>
                                <p className="text-[10px] text-zinc-400 truncate">
                                  {chEpg?.currentProg ? chEpg.currentProg.title : ch.group}
                                </p>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Kanal- / Film-metadata under spelaren */}
                  <div className="bg-[#111215] border border-white/10 rounded-2xl p-5 space-y-4">
                    <div className="flex flex-wrap items-start justify-between gap-4">
                      <div className="space-y-1 min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                          <span style={{ backgroundColor: accentColor }} className="text-[10px] font-black uppercase px-2 py-0.5 rounded text-black">
                            {currentMedia.type === 'live'
                              ? 'LIVE TV'
                              : currentMedia.type === 'vod_channel'
                              ? 'VOD-KANAL'
                              : currentMedia.type === 'series'
                              ? 'SERIE'
                              : 'FILM'}
                          </span>
                          {currentMedia.quality && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded border border-white/20 text-zinc-300">
                              {currentMedia.quality}
                            </span>
                          )}
                          <span className="text-xs text-zinc-400 truncate">{currentMedia.group}</span>
                        </div>
                        <h1 className="text-lg sm:text-2xl font-black text-white truncate">{currentMedia.name}</h1>
                        {activeChannelEpg?.currentProg ? (
                          <div className="pt-1 space-y-1">
                            <p className="text-xs sm:text-sm text-[#F3D078] font-bold">
                              Nu: {activeChannelEpg.currentProg.title}{' '}
                              <span className="text-zinc-400 font-normal">
                                ({formatTime(activeChannelEpg.currentProg.start)} - {formatTime(activeChannelEpg.currentProg.stop)})
                              </span>
                            </p>
                            <div className="w-full max-w-md bg-white/10 h-1.5 rounded-full overflow-hidden">
                              <div className="h-full rounded-full" style={{ width: `${activeChannelEpg.progress}%`, backgroundColor: accentColor }} />
                            </div>
                          </div>
                        ) : (
                          <p className="text-xs text-zinc-500">
                            {currentMedia.type === 'live' || currentMedia.type === 'vod_channel'
                              ? 'TV-guiden innehåller ingen information om programmet som visas just nu.'
                              : `År: ${currentMedia.year || '2025'} • ★ ${currentMedia.rating || '8,1'}`}
                          </p>
                        )}
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          onClick={() => setFavModalItem(currentMedia)}
                          className="bg-zinc-800 hover:bg-zinc-700 text-[#F3D078] border border-white/10 px-4 py-2.5 rounded-xl text-xs font-extrabold transition"
                        >
                          ★ Favoritmapp
                        </button>
                        <button
                          onClick={() => openInExternalPlayer('vlc', currentMedia)}
                          className="bg-[#FF6B00] hover:brightness-110 text-white px-4 py-2.5 rounded-xl text-xs font-extrabold transition"
                        >
                          🟠 Reserv: VLC
                        </button>
                        <button
                          onClick={() => copyStreamUrl(currentMedia)}
                          className="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold border border-white/10 transition"
                        >
                          {copyFeedback ? '✓ Kopierad!' : '🔗 Kopiera länk'}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* EXPANDERAD KATEGORI-VY */}
              {!isFullscreenPlayer && expandedCategory && (
                <div className="px-4 sm:px-8 py-6 space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-4">
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#F3D078]">KATALOGVY</span>
                      <h1 className="text-xl sm:text-2xl font-black text-white mt-0.5">
                        {expandedCategory.title} ({expandedCategory.items.length})
                      </h1>
                    </div>
                    <div className="flex items-center gap-2">
                      {expandedCategory.isFavoriteView && (
                        <button
                          onClick={() => setManageFavModal(true)}
                          className="bg-[#F3D078] text-black px-4 py-2 rounded-xl text-xs font-extrabold transition"
                        >
                          🗑 Markera & Ta bort flera favoriter
                        </button>
                      )}
                      <button
                        onClick={() => { setExpandedCategory(null); setRenderLimit(80); }}
                        className="bg-zinc-900 hover:bg-zinc-800 border border-white/15 px-4 py-2 rounded-xl text-xs font-bold transition"
                      >
                        ← Tillbaka
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4">
                    {expandedCategory.items.slice(0, renderLimit).map((item) => (
                      <div
                        key={item.id}
                        onClick={() => handleCardSelect(item)}
                        className="group relative aspect-[2/3] rounded-xl overflow-hidden bg-[#121316] border border-white/10 hover:border-[#F3D078] cursor-pointer transition hover:scale-[1.015] flex flex-col justify-end"
                      >
                        <SmartMediaImage src={item.logo} alt={item.seriesTitle || item.name} mode="poster" itemType={item.type} />
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/35 to-transparent z-10" />
                        {expandedCategory.isFavoriteView && (
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              quickRemoveSingleFavorite(item);
                              setExpandedCategory((prev) => ({
                                ...prev,
                                items: prev.items.filter((x) => x.id !== item.id)
                              }));
                            }}
                            title="Ta bort favorit"
                            className="absolute top-2 right-2 z-20 w-8 h-8 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-bold flex items-center justify-center shadow"
                          >
                            🗑
                          </button>
                        )}
                        <div className="relative z-20 p-3 space-y-1 text-center">
                          <span className="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded bg-[#F3D078] text-black inline-block">
                            {item.type === 'live' ? 'LIVE' : item.type === 'vod_channel' ? 'VOD-KANAL' : item.type === 'series' ? 'SERIE' : 'FILM'}
                          </span>
                          <h3 className="font-bold text-xs text-white line-clamp-2">{item.name}</h3>
                        </div>
                      </div>
                    ))}
                  </div>

                  {expandedCategory.items.length > renderLimit && (
                    <button
                      onClick={() => setRenderLimit((prev) => prev + 100)}
                      className="w-full py-3.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-white/10 text-xs font-extrabold text-[#F3D078] transition"
                    >
                      Visa fler ({expandedCategory.items.length - renderLimit} kvar)...
                    </button>
                  )}
                </div>
              )}

              {/* 1. FLIK: "FÖR DIG", "FILMER" ELLER "SERIER" */}
              {!isFullscreenPlayer && !expandedCategory && (activeTab === 'home' || activeTab === 'movies' || activeTab === 'series') && (
                <div className="space-y-8 pb-10">
                  
                  {/* HERO-BANNER */}
                  {heroItem && (
                    <div className="relative w-full h-[360px] sm:h-[430px] flex flex-col justify-end overflow-hidden border-b border-white/5 bg-black">
                      <SmartMediaImage src={heroItem.logo} alt={heroItem.seriesTitle || heroItem.name} mode="landscape" itemType={heroItem.type} />
                      <div className="absolute inset-0 hero-vignette z-10" />

                      <div className="relative z-20 max-w-3xl mx-auto w-full px-6 pb-8 text-center space-y-3.5">
                        <h1 className="text-2xl sm:text-4xl md:text-5xl font-black tracking-tight text-white drop-shadow-[0_6px_25px_rgba(0,0,0,0.95)] line-clamp-2">
                          {heroItem.seriesTitle || heroItem.name}
                        </h1>

                        <div className="flex items-center justify-center gap-3 text-xs sm:text-sm font-semibold text-zinc-300">
                          <span>
                            {heroItem.type === 'series'
                              ? 'TV-Serie'
                              : heroItem.type === 'movies'
                              ? 'Bio-Film'
                              : heroItem.type === 'vod_channel'
                              ? 'VOD-Kanal'
                              : 'Live TV'}
                          </span>
                          <span>•</span>
                          <span>{heroItem.year || '2025'}</span>
                          {heroItem.quality && (
                            <>
                              <span>•</span>
                              <span className="px-1.5 py-0.5 rounded bg-white/15 text-white text-[11px] font-bold">{heroItem.quality}</span>
                            </>
                          )}
                          <span>•</span>
                          <span className="text-[#F3D078] font-bold">★ {heroItem.rating || '8,2'}</span>
                        </div>

                        <div className="flex items-center justify-center gap-5 pt-2">
                          <button
                            onClick={() => setFavModalItem(heroItem)}
                            className="w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-lg text-[#F3D078] transition"
                            title="Lägg till i favoriter"
                          >
                            ☆
                          </button>

                          <button
                            onClick={() => handleCardSelect(heroItem)}
                            style={{ backgroundColor: accentColor }}
                            className="hover:brightness-110 text-black font-extrabold px-8 py-3.5 rounded-full text-sm flex items-center gap-2.5 shadow-[0_10px_30px_rgba(243,208,120,0.3)] hover:scale-105 transition"
                          >
                            <span>▶</span>
                            <span>{tr.playNow}</span>
                          </button>

                          <button
                            onClick={() => setDetailItem(heroItem)}
                            className="w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-sm font-bold text-white transition"
                            title="Mer info"
                          >
                            ⓘ
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* GOOGLE ADSENSE I GRATISVERSIONEN */}
                  {appEdition === 'free' && !isSubscriber && <GoogleAdBanner position="top" onUpgradeClick={() => setPaywallModal(true)} />}

                  {channels.length <= 2 && movies.length === 0 && series.length === 0 && vodChannels.length === 0 && (
                    <div className="mx-4 sm:mx-8 p-6 rounded-2xl bg-gradient-to-r from-amber-950/40 via-zinc-900 to-zinc-950 border border-[#F3D078]/30 flex flex-wrap items-center justify-between gap-4">
                      <div className="space-y-1">
                        <span className="text-[10px] font-black uppercase tracking-widest text-[#F3D078]">VÄLKOMMEN TILL ZAPPAPORTALEN</span>
                        <h3 className="text-base sm:text-lg font-extrabold text-white">Ladda in din M3U-spellista & EPG</h3>
                        <p className="text-xs text-zinc-400">Din spellista sorteras automatiskt i Live TV, VOD-kanaler, Filmer och Serier.</p>
                      </div>
                      <button
                        onClick={() => { setActiveTab('settings'); setSettingsSubView('sources'); }}
                        style={{ backgroundColor: accentColor }}
                        className="px-5 py-3 rounded-xl text-xs font-extrabold text-black shadow-lg hover:brightness-110 transition"
                      >
                        + Spellista Hantering
                      </button>
                    </div>
                  )}

                  {/* RAD 1: FORTSÄTT ATT TITTA */}
                  {watchHistory.length > 0 && (
                    <MediaCarouselRow
                      title={tr.continueWatching}
                      items={watchHistory}
                      type="landscape"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      favItemIds={allFavoritedIds}
                      watchProgressMap={watchProgress}
                      onExpand={() => setExpandedCategory({ title: tr.continueWatching, items: watchHistory })}
                    />
                  )}

                  {/* FAVORITER FILTRERADE PER FLIK */}
                  {activeTab === 'movies' && movieFavoritesOnly.length > 0 && (
                    <MediaCarouselRow
                      title="Favoriter – Filmer"
                      subtitle="Endast dina sparade filmfavoriter (klicka på 🗑 för att ta bort)"
                      items={movieFavoritesOnly}
                      type="poster"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      onQuickRemoveFav={quickRemoveSingleFavorite}
                      favItemIds={allFavoritedIds}
                      onExpand={() => setExpandedCategory({ title: 'Favoriter – Filmer', items: movieFavoritesOnly, isFavoriteView: true })}
                    />
                  )}

                  {activeTab === 'series' && seriesFavoritesOnly.length > 0 && (
                    <MediaCarouselRow
                      title="Favoriter – Serier"
                      subtitle="Endast dina sparade seriefavoriter (klicka på 🗑 för att ta bort)"
                      items={seriesFavoritesOnly}
                      type="poster"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      onQuickRemoveFav={quickRemoveSingleFavorite}
                      favItemIds={allFavoritedIds}
                      onExpand={() => setExpandedCategory({ title: 'Favoriter – Serier', items: seriesFavoritesOnly, isFavoriteView: true })}
                    />
                  )}

                  {activeTab === 'home' && allFavoriteItemsCombined.length > 0 && (
                    <MediaCarouselRow
                      title="Dina Favoriter"
                      subtitle="Klicka på 🗑 på valfritt kort för att ta bort direkt, eller Expandera för att ta bort flera"
                      items={allFavoriteItemsCombined}
                      type="poster"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      onQuickRemoveFav={quickRemoveSingleFavorite}
                      favItemIds={allFavoritedIds}
                      onExpand={() => setExpandedCategory({ title: 'Alla Favoriter', items: allFavoriteItemsCombined, isFavoriteView: true })}
                    />
                  )}

                  {/* RAD 3: NYLIGEN TILLAGDA FILMER */}
                  {(activeTab === 'home' || activeTab === 'movies') && recentlyAddedMovies.length > 0 && (
                    <MediaCarouselRow
                      title={tr.recentlyAddedMovies}
                      subtitle="Sorterade efter uppladdningstid – senaste filmen först"
                      items={recentlyAddedMovies.slice(0, 35)}
                      type="poster"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      favItemIds={allFavoritedIds}
                      onExpand={() => setExpandedCategory({ title: tr.recentlyAddedMovies, items: recentlyAddedMovies })}
                    />
                  )}

                  {/* RAD 4: NYLIGEN TILLAGDA SERIER */}
                  {(activeTab === 'home' || activeTab === 'series') && recentlyAddedSeries.length > 0 && (
                    <MediaCarouselRow
                      title={tr.recentlyAddedSeries}
                      subtitle="Sorterade efter senaste uppladdade avsnitt"
                      items={recentlyAddedSeries.slice(0, 35)}
                      type="poster"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      favItemIds={allFavoritedIds}
                      onExpand={() => setExpandedCategory({ title: tr.recentlyAddedSeries, items: recentlyAddedSeries })}
                    />
                  )}

                  {/* RAD 5: VOD-KANALER */}
                  {activeTab === 'home' && vodChannels.length > 0 && (
                    <MediaCarouselRow
                      title="VOD-kanaler & 24/7"
                      subtitle="Dedikerade film- och maratonkanaler"
                      items={vodChannels.slice(0, 25)}
                      type="live-card"
                      onSelect={handleCardSelect}
                      getChannelEpg={getChannelEpg}
                      onExpand={() => setActiveTab('vod_channels')}
                    />
                  )}

                  {/* RAD 6: LIVE-KANALER */}
                  {activeTab === 'home' && channels.length > 0 && (
                    <MediaCarouselRow
                      title="Live TV & Populära Kanaler"
                      items={watchHistory.filter((x) => x.type === 'live').concat(channels).slice(0, 20)}
                      type="live-card"
                      onSelect={handleCardSelect}
                      getChannelEpg={getChannelEpg}
                      onExpand={() => setActiveTab('live')}
                    />
                  )}

                  {/* RAD 7: TRENDIG DENNA VECKA */}
                  {(activeTab === 'home' || activeTab === 'movies') && recentlyAddedMovies.length > 0 && (
                    <MediaCarouselRow
                      title="Trendiga filmer denna vecka"
                      items={recentlyAddedMovies.slice(0, 10)}
                      type="rank"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      favItemIds={allFavoritedIds}
                    />
                  )}

                  {activeTab === 'series' && recentlyAddedSeries.length > 0 && (
                    <MediaCarouselRow
                      title="Trendiga serier denna vecka"
                      items={recentlyAddedSeries.slice(0, 10)}
                      type="rank"
                      onSelect={handleCardSelect}
                      onFavClick={setFavModalItem}
                      favItemIds={allFavoritedIds}
                    />
                  )}

                  <section className="space-y-2.5 px-4 sm:px-8">
                    <h2 className="text-base sm:text-lg font-extrabold text-white">Utforska efter genre</h2>
                    <div className="flex items-center gap-3.5 overflow-x-auto no-scrollbar py-1">
                      {GENRE_CARDS.map((g) => (
                        <div
                          key={g.id}
                          onClick={() => openGenreFilter(g)}
                          className={`shrink-0 w-52 sm:w-60 h-28 sm:h-32 rounded-2xl bg-gradient-to-br ${g.gradient} border border-white/15 hover:border-[#F3D078] cursor-pointer p-4 flex flex-col justify-between relative overflow-hidden group transition hover:scale-[1.02] shadow-lg`}
                        >
                          <span className="text-3xl opacity-80">{g.icon}</span>
                          <span className="text-base sm:text-lg font-black tracking-wide text-white drop-shadow">{g.label}</span>
                        </div>
                      ))}
                    </div>
                  </section>

                  <section className="space-y-2.5 px-4 sm:px-8">
                    <h2 className="text-base sm:text-lg font-extrabold text-white">Utforska efter år</h2>
                    <div className="flex items-center gap-3.5 overflow-x-auto no-scrollbar py-1">
                      {YEAR_CARDS.map((yr) => (
                        <div
                          key={yr}
                          onClick={() => openYearFilter(yr)}
                          className="shrink-0 w-48 sm:w-56 h-24 sm:h-28 rounded-2xl bg-gradient-to-tr from-zinc-950 via-zinc-900 to-amber-950/50 border border-white/15 hover:border-[#F3D078] cursor-pointer flex items-center justify-center relative overflow-hidden group transition hover:scale-[1.02] shadow-lg"
                        >
                          <span className="text-3xl sm:text-4xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-[#F3D078] to-amber-600">
                            {yr}
                          </span>
                        </div>
                      ))}
                    </div>
                  </section>

                  {(activeTab === 'home' || activeTab === 'movies') &&
                    movieGroups.slice(0, activeTab === 'movies' ? 25 : 8).map(([grpName, grpItems]) => (
                      <MediaCarouselRow
                        key={'mov_' + grpName}
                        title={grpName}
                        items={grpItems}
                        type="poster"
                        onSelect={handleCardSelect}
                        onFavClick={setFavModalItem}
                        favItemIds={allFavoritedIds}
                        onExpand={() => setExpandedCategory({ title: grpName, items: grpItems })}
                      />
                    ))}

                  {(activeTab === 'home' || activeTab === 'series') &&
                    seriesGroups.slice(0, activeTab === 'series' ? 25 : 8).map(([grpName, grpItems]) => (
                      <MediaCarouselRow
                        key={'ser_' + grpName}
                        title={grpName}
                        items={grpItems}
                        type="poster"
                        onSelect={handleCardSelect}
                        onFavClick={setFavModalItem}
                        favItemIds={allFavoritedIds}
                        onExpand={() => setExpandedCategory({ title: grpName, items: grpItems })}
                      />
                    ))}

                  {appEdition === 'free' && !isSubscriber && <GoogleAdBanner position="bottom" onUpgradeClick={() => setPaywallModal(true)} />}
                </div>
              )}

              {/* 2. SEPARAT FLIK: VOD-KANALER */}
              {!isFullscreenPlayer && !expandedCategory && activeTab === 'vod_channels' && (
                <div className="px-4 sm:px-8 py-5 space-y-6">
                  {appEdition === 'free' && !isSubscriber && <GoogleAdBanner position="top" onUpgradeClick={() => setPaywallModal(true)} />}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#F3D078]">24/7 & BIOKANALER</span>
                        <h1 className="text-xl sm:text-2xl font-black text-white">VOD-kanaler ({vodChannels.length} st)</h1>
                      </div>
                      <button
                        onClick={() => setManageFavModal(true)}
                        className="text-xs font-extrabold text-[#F3D078] bg-[#F3D078]/10 border border-[#F3D078]/30 px-3.5 py-2 rounded-xl"
                      >
                        ★ {tr.smartFolders}
                      </button>
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                      <button
                        onClick={() => { setSelectedVodChGroup('ALL'); setRenderLimit(80); }}
                        style={selectedVodChGroup === 'ALL' ? { backgroundColor: accentColor } : {}}
                        className={`px-4 py-2 rounded-full text-xs font-extrabold shrink-0 transition ${
                          selectedVodChGroup === 'ALL' ? 'text-black' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-white/10'
                        }`}
                      >
                        Alla VOD-kanaler ({vodChannels.length})
                      </button>

                      {Object.keys(vodChannelGroups).map((grp) => (
                        <button
                          key={grp}
                          onClick={() => { setSelectedVodChGroup(grp); setRenderLimit(80); }}
                          style={selectedVodChGroup === grp ? { backgroundColor: accentColor } : {}}
                          className={`px-4 py-2 rounded-full text-xs font-bold shrink-0 transition ${
                            selectedVodChGroup === grp ? 'text-black font-extrabold' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-white/10'
                          }`}
                        >
                          {grp} ({vodChannelGroups[grp].length})
                        </button>
                      ))}
                    </div>
                  </div>

                  {vodChannels.length === 0 ? (
                    <div className="p-8 rounded-2xl bg-[#111215] border border-white/10 text-center space-y-2">
                      <p className="text-sm font-bold text-white">Inga separata VOD-kanaler hittades i din nuvarande spellista</p>
                      <p className="text-xs text-zinc-400">Dina on-demand-filmer ligger under fliken "Filmer" och vanliga TV-kanaler under "Live TV".</p>
                    </div>
                  ) : (
                    (() => {
                      const list = selectedVodChGroup === 'ALL' ? vodChannels : vodChannelGroups[selectedVodChGroup] || [];
                      return (
                        <>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">
                            {list.slice(0, renderLimit).map((ch) => {
                              const epg = getChannelEpg(ch);
                              const isPlaying = currentMedia?.id === ch.id;
                              return (
                                <div
                                  key={ch.id}
                                  onClick={() => startPlayback(ch, true)}
                                  className={`rounded-2xl bg-[#111215] border p-4 flex flex-col justify-between cursor-pointer transition hover:scale-[1.01] ${
                                    isPlaying ? 'border-[#F3D078] shadow-[0_0_20px_rgba(243,208,120,0.25)]' : 'border-white/10 hover:border-white/30'
                                  }`}
                                >
                                  <div className="flex items-center justify-between gap-3">
                                    <div className="flex items-center gap-3 min-w-0 flex-1">
                                      <div className="w-12 h-12 rounded-xl bg-black border border-white/10 flex items-center justify-center p-1.5 shrink-0">
                                        {ch.logo ? (
                                          <img src={ch.logo} alt="" loading="lazy" className="max-w-full max-h-full object-contain" />
                                        ) : (
                                          <span className="text-xs font-black text-[#F3D078]">VOD</span>
                                        )}
                                      </div>
                                      <div className="min-w-0 flex-1">
                                        <h3 className="text-xs sm:text-sm font-bold text-white truncate">{ch.name}</h3>
                                        <div className="flex items-center gap-1.5 mt-1">
                                          {ch.quality && (
                                            <span className="text-[9px] font-bold px-1.5 py-0.2 rounded border border-white/20 text-zinc-300">
                                              {ch.quality}
                                            </span>
                                          )}
                                          <span className="text-[10px] text-zinc-400 truncate">{ch.group}</span>
                                        </div>
                                      </div>
                                    </div>

                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setFavModalItem(ch);
                                      }}
                                      className={`w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${
                                        allFavoritedIds.has(ch.id) ? 'bg-[#F3D078] text-black font-black' : 'bg-white/5 text-zinc-400 hover:text-white'
                                      }`}
                                    >
                                      ★
                                    </button>
                                  </div>
